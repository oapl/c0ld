<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YAMO1-9 Leagues</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0d1117;--panel:#161b22;--panel2:#0f141b;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--link:#ff9b96;--hover:#1f2630;--good:#3fb950;--bad:#f85149;--warn:#d29922}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:var(--link);text-decoration:none}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 22px 10px}
.logo-wrap{display:flex;justify-content:center;align-items:center;width:100%}
.site-logo{display:block;width:76px;border-radius:10px;margin:0 auto}
.menu{margin-top:9px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.menu a{display:inline-block;padding:7px 12px;border:1px solid var(--border);border-radius:5px;background:var(--panel2);color:var(--text);font-size:13px}
.menu a.active{border-color:var(--link);color:var(--link);background:rgba(248,81,73,.12)}
main{max-width:1280px;margin:0 auto;padding:22px 24px 28px}
.hero,.section,.card{background:var(--panel);border:1px solid var(--border);border-radius:10px}
.hero{padding:18px;margin-bottom:18px}
.hero h1{margin:0;font-size:26px}
.hero p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.card{padding:16px;text-align:center;min-height:88px;display:flex;flex-direction:column;justify-content:center}
.label{color:var(--muted);font-size:13px}.value{font-size:20px;font-weight:700;margin-top:6px}
.section{overflow:hidden}
.section-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.section-title{margin:0;font-size:18px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);padding:9px 11px;font-size:14px;cursor:pointer}
button:hover{border-color:var(--link);background:var(--hover)}
button:disabled{opacity:.65;cursor:not-allowed}
.note{color:var(--muted);font-size:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:960px}
th,td{padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
th{color:var(--muted);font-size:13px;font-weight:500;text-align:left;cursor:pointer}
.numeric{text-align:right;font-variant-numeric:tabular-nums}
.rank{font-weight:700}.league{font-weight:700}
.league-cell{display:flex;align-items:center;gap:10px}
.league-icon{width:34px;height:34px;border-radius:8px;background:#21262d;object-fit:cover;flex:0 0 auto}
.source{color:var(--muted);font-size:12px;margin-top:2px}
.positive{color:var(--good);font-weight:700}.negative{color:var(--bad);font-weight:700}.zero,.unknown{color:var(--muted)}
.missing td{color:var(--muted)}
.status{margin-bottom:18px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--panel);color:var(--muted);font-size:13px;display:none}
.status.error{display:block;border-color:var(--bad);background:rgba(248,81,73,.12);color:#ffb4ad}
.status.info{display:block}
.empty{padding:20px;color:var(--muted)}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}
@media(max-width:650px){main{padding:16px}.cards{grid-template-columns:1fr}button{width:100%}.controls{width:100%}}
</style>
</head>
<body>
<header>
  <div class="logo-wrap"><a href="index.html"><img class="site-logo" src="assets/c0ld-kitsune-logo.gif" alt="c0ld"></a></div>
  <div class="menu">
    <a href="index.html">c0ld Leaderboard</a>
    <a href="clans.html">Top Clans</a>
    <a href="c0ld-leagues.html">c0ld Leagues</a>
    <a href="top-leagues.html">Top Leagues</a>
    <a href="live-clan.html">Clan Lookup</a>
  </div>
</header>
<main>
  <section class="hero">
    <h1>YAMO1-9 Leagues</h1>
  </section>
  <section class="cards">
    <div class="card"><div class="label">Tracked Leagues</div><div class="value" id="tracked-count">12</div></div>
    <div class="card"><div class="label">Found in Top 1000</div><div class="value" id="found-count">&mdash;</div></div>
    <div class="card"><div class="label">Total Points</div><div class="value" id="total-points">&mdash;</div></div>
    <div class="card"><div class="label">Last Update</div><div class="value" id="last-db-update">&mdash;</div></div>
  </section>

  <section class="section">
    <div class="section-header">
      <div>
        <h2 class="section-title">Alt League Totals</h2>
      </div>
      <div class="controls"><button id="refresh-btn" type="button">Refresh</button></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="rank">Rank</th>
            <th data-sort="league_name">League</th>
            <th data-sort="total_points" class="numeric">Total Points</th>
            <th data-sort="gain_5m" class="numeric">5m</th>
            <th data-sort="gain_1h" class="numeric">1 Hour</th>
            <th data-sort="gain_6h" class="numeric">6 Hours</th>
            <th data-sort="gain_12h" class="numeric">12 Hours</th>
            <th data-sort="gain_24h" class="numeric">24 Hours</th>
            <th data-sort="projected_rank_1h" class="numeric">Projected Rank</th>
          </tr>
        </thead>
        <tbody id="leagues-tbody"><tr><td colspan="9" class="empty">Loading YAMO alt leagues...</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const API="https://yamo-league-api-worker.opal-dde.workers.dev";
const RUN_KEY="active";
const TARGET_LEAGUES=["YAMO1","YAMO2","YAMO3","YAMO4","YAMO5","YAMO6","YAMO7","YAMO8","YAMO9","1YAMO","2YAMO","3YAMO"];
let rows=[],sortKey="rank",sortAsc=true,loading=false,lastSnapshot=null,lastSource="";
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function key(v){return String(v||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"")}
function shortNum(v){const n=Number(v);if(!Number.isFinite(n))return"&mdash;";const a=Math.abs(n);if(a>=1e12)return(n/1e12).toFixed(2).replace(/\.00$/,"")+"T";if(a>=1e9)return(n/1e9).toFixed(2).replace(/\.00$/,"")+"B";if(a>=1e6)return(n/1e6).toFixed(2).replace(/\.00$/,"")+"M";if(a>=1e3)return(n/1e3).toFixed(2).replace(/\.00$/,"")+"K";return n.toLocaleString("en-US")}
function fullNum(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-US"):"-"}
function rank(v){const n=Number(v);return Number.isFinite(n)&&n>0?"#"+n.toLocaleString("en-US"):"-"}
function dt(v){const d=new Date(v||0);return Number.isNaN(d.getTime())?"-":d.toLocaleString()}
function delta(v){if(v==null)return'<span class="unknown">-</span>';const n=Number(v);if(!Number.isFinite(n))return'<span class="unknown">-</span>';if(n>0)return'<span class="positive">+'+shortNum(n)+'</span>';if(n<0)return'<span class="negative">'+shortNum(n)+'</span>';return'<span class="zero">0</span>'}
function setStatus(text,kind="info"){const el=document.getElementById("status");if(!el)return;el.className="status "+kind;el.textContent=text||""}
function clearStatus(){const el=document.getElementById("status");if(!el)return;el.className="status";el.textContent=""}
function iconUrl(icon){const t=String(icon||"").trim();if(!t)return"";if(/^https?:\/\//i.test(t)||t.startsWith("data:"))return t;const m=t.match(/rbxassetid:\/\/(\d+)/i);if(m)return"https://ps99.biggamesapi.io/image/"+encodeURIComponent(m[1]);if(/^\d+$/.test(t))return"https://ps99.biggamesapi.io/image/"+encodeURIComponent(t);return""}
function icon(row){const src=iconUrl(row.league_icon);return src?'<img class="league-icon" src="'+esc(src)+'" alt="">':'<span class="league-icon"></span>'}
function rowSource(row){if(row.source==="missing")return"not found in Top 1000";return lastSource||"league snapshot"}
function compare(a,b,k,asc){const an=Number(a[k]),bn=Number(b[k]);let r;if(k==="league_name")r=TARGET_LEAGUES.indexOf(a.target)-TARGET_LEAGUES.indexOf(b.target);else if(Number.isFinite(an)&&Number.isFinite(bn))r=an-bn;else if(Number.isFinite(an))r=-1;else if(Number.isFinite(bn))r=1;else r=String(a[k]||"").localeCompare(String(b[k]||""));return asc?r:-r}
function visible(){return rows.slice().sort((a,b)=>compare(a,b,sortKey,sortAsc))}
function renderCards(){const found=rows.filter(r=>r.source!=="missing").length;const pointRows=rows.filter(r=>Number.isFinite(Number(r.total_points)));const total=pointRows.reduce((sum,r)=>sum+(Number(r.total_points)||0),0);document.getElementById("tracked-count").textContent=TARGET_LEAGUES.length;document.getElementById("found-count").textContent=found+"/"+TARGET_LEAGUES.length;document.getElementById("total-points").textContent=pointRows.length?shortNum(total):"-";document.getElementById("total-points").title=pointRows.length?fullNum(total):"";document.getElementById("last-db-update").textContent=lastSnapshot?dt(lastSnapshot):"-"}
function render(){const tbody=document.getElementById("leagues-tbody");const list=visible();renderCards();if(!list.length){tbody.innerHTML='<tr><td colspan="9" class="empty">No alt league rows loaded.</td></tr>';return}tbody.innerHTML=list.map(r=>'<tr class="'+esc(r.source==="missing"?"missing":"")+'"><td class="rank">'+esc(rank(r.rank))+'</td><td><div class="league-cell">'+icon(r)+'<div><div class="league">'+esc(r.league_name||r.target)+'</div><div class="source">'+esc(rowSource(r))+'</div></div></div></td><td class="numeric" title="'+esc(fullNum(r.total_points))+'">'+shortNum(r.total_points)+'</td><td class="numeric">'+delta(r.gain_5m)+'</td><td class="numeric">'+delta(r.gain_1h)+'</td><td class="numeric">'+delta(r.gain_6h)+'</td><td class="numeric">'+delta(r.gain_12h)+'</td><td class="numeric">'+delta(r.gain_24h)+'</td><td class="numeric">'+esc(rank(r.projected_rank_1h))+'</td></tr>').join("")}
async function fetchJson(url){const res=await fetch(url,{cache:"no-store"});const data=await res.json().catch(()=>null);if(!res.ok||data?.ok===false)throw new Error(data?.error||data?.message||"HTTP "+res.status);return data}
async function loadStoredRows(){const url=new URL(API+"/api/leagues/top-leagues");url.searchParams.set("limit","1000");url.searchParams.set("run",RUN_KEY);url.searchParams.set("v",Date.now());const data=await fetchJson(url);lastSnapshot=data.snapshot_at||null;lastSource=data.source||"";const byName=new Map((data.rows||[]).map(row=>[key(row.league_name||row.display_name),row]));return TARGET_LEAGUES.map(target=>{const row=byName.get(key(target));return row?{...row,target,source:"league"}:{target,source:"missing",league_name:target,total_points:null,rank:null,projected_rank_1h:null,gain_5m:null,gain_1h:null,gain_6h:null,gain_12h:null,gain_24h:null}})}
async function loadData(){if(loading)return;loading=true;document.getElementById("refresh-btn").disabled=true;setStatus("Loading YAMO alt leagues...");try{rows=await loadStoredRows();const missing=rows.filter(r=>r.source==="missing").map(r=>r.target);if(missing.length)setStatus(missing.join(", ")+" not found in the Top 1000 league data. Confirm the exact league name or that it is inside Top 1000.");else clearStatus();render()}catch(err){console.error(err);rows=TARGET_LEAGUES.map(target=>({target,source:"missing",league_name:target}));setStatus(err.message||String(err),"error");render()}finally{loading=false;document.getElementById("refresh-btn").disabled=false}}
document.getElementById("refresh-btn").addEventListener("click",loadData);
document.querySelectorAll("th[data-sort]").forEach(th=>th.addEventListener("click",()=>{const k=th.dataset.sort;if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=k==="rank"||k==="league_name"||k==="projected_rank_1h"}render()}));
loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
