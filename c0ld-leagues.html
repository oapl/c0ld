<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>c0ld Leagues</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#0d1117;--panel:#161b22;--panel-2:#0d1117;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--link:#ff9b96;--hover:#1f2630;--good:#3fb950;--warn:#d29922;--danger:#f85149;--danger-bg:rgba(248,81,73,.12)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
a{color:var(--link);text-decoration:none}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 22px 10px}
.logo-wrap{display:flex;justify-content:center;align-items:center;width:100%}
.site-logo{display:block;width:76px;border-radius:10px;margin:0 auto}
.menu{margin-top:9px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.menu a{display:inline-block;padding:7px 12px;border:1px solid var(--border);border-radius:5px;background:var(--panel-2);color:var(--text);font-size:13px}
.menu a.active{border-color:var(--link);color:var(--link);background:rgba(248,81,73,.12)}
main{max-width:1360px;margin:0 auto;padding:22px 24px 28px}
.hero,.section,.card{background:var(--panel);border:1px solid var(--border);border-radius:10px}
.hero{padding:18px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.hero h1{margin:0 0 4px;font-size:28px}
.subtle{color:var(--muted);font-size:13px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,button{border:1px solid var(--border);border-radius:6px;background:var(--panel-2);color:var(--text);padding:9px 11px;font-size:14px;outline:none}
button{cursor:pointer}
button:hover,input:focus,select:focus{border-color:var(--link);background:var(--hover)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:16px;margin-bottom:18px}
.card{padding:16px;text-align:center;min-height:92px;display:flex;flex-direction:column;justify-content:center}
.label{color:var(--muted);font-size:13px;margin-bottom:6px}
.value{font-size:20px;font-weight:700;line-height:1.25}
.section{overflow:hidden}
.section-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.section-title{margin:0;font-size:18px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1120px}
th,td{padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top}
th{color:var(--muted);font-size:13px;text-align:left;cursor:pointer;font-weight:500}
th:not([data-sort]){cursor:default}
.numeric{text-align:right;font-variant-numeric:tabular-nums}
.rank{font-weight:700}
.league-cell{display:flex;align-items:center;gap:10px;font-weight:700}
.league-icon{width:38px;height:38px;border-radius:8px;background:#21262d;display:inline-flex;align-items:center;justify-content:center;object-fit:cover;color:#c9d1d9;flex:0 0 auto}
.members{display:flex;flex-wrap:wrap;gap:6px;max-width:520px;white-space:normal}
.member-pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:999px;background:#0f141b;padding:4px 8px;font-size:12px;color:#c9d1d9}
.member-pill strong{color:var(--text)}
.positive{color:var(--good);font-weight:700}
.negative{color:var(--danger);font-weight:700}
.zero,.unknown{color:var(--muted)}
.empty,.error{padding:20px}
.error{color:#ffb4ad;background:var(--danger-bg)}
tbody tr:hover{background:rgba(255,255,255,.02)}
@media(max-width:900px){.hero{align-items:stretch}.controls>*{width:100%}}
@media(max-width:650px){main{padding:16px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo-wrap"><a href="index.html"><img class="site-logo" src="assets/c0ld-kitsune-logo.gif" alt="c0ld"></a></div><div class="menu">

    <a href="clans.html">Top Clans</a>

    <div class="card"><div class="label">Top 8,500</div><div class="value" id="top8500-count">-</div></div>

    <div class="section-header">
      <h2 class="section-title" id="section-title">c0ld Leagues</h2>

    <div class="table-wrap">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"><tr><td colspan="8" class="empty">Refreshing latest c0ld leagues...</td></tr></tbody>

    </div>
  </section>
</main>
<script>
const API="https://yamo-league-api-worker.opal-dde.workers.dev";

const RUN_KEY="active";
const REFRESH_INTERVAL_MS=5*60*1000;
const TRACKED_LEAGUES=[

  {name:"3v4",id:"cd897be1a8cb430b8194d01ca10decca",page:"3v4.html",rank:7},

  {name:"RAZ0",id:"32ff88296dc94de5ac4b459dab0743af",page:"raz0.html",rank:26},

  {name:"FYNE",id:"ca75d53b75f2422dbdf41217a20debd3",page:"fyne.html",rank:29},

  {name:"zee2",id:"341f28e8351940b4bcaf6cd0ca30c59a",page:"zee2.html",rank:31}
];
const COLD_MEMBER_OVERRIDE_IDS=new Set(["1462748729"]);
let leagueRows=[],memberRows=[],sortKey="rank",sortAsc=true,loading=false,lastUpdated=null,errors=[],knownPlayers=new Map(),knownC0ldMembers=new Set(COLD_MEMBER_OVERRIDE_IDS);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function shortNum(v){const n=Number(v);if(!Number.isFinite(n))return"-";const a=Math.abs(n);if(a>=1e12)return(n/1e12).toFixed(2).replace(/\.00$/,"")+"T";if(a>=1e9)return(n/1e9).toFixed(2).replace(/\.00$/,"")+"B";if(a>=1e6)return(n/1e6).toFixed(2).replace(/\.00$/,"")+"M";if(a>=1e3)return(n/1e3).toFixed(2).replace(/\.00$/,"")+"K";return n.toLocaleString("en-US")}
function fullNum(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-US"):"-"}
function dt(v){const d=new Date(v||0);return Number.isNaN(d.getTime())?"-":d.toLocaleString()}
function initials(s){s=String(s||"?").trim();return s.slice(0,2).toUpperCase()}
function iconUrl(icon){const t=String(icon||"").trim();if(!t)return"";if(/^https?:\/\//i.test(t)||t.startsWith("data:"))return t;const m=t.match(/rbxassetid:\/\/(\d+)/i);if(m)return"https://ps99.biggamesapi.io/image/"+encodeURIComponent(m[1]);if(/^\d+$/.test(t))return"https://ps99.biggamesapi.io/image/"+encodeURIComponent(t);return""}
function leagueIcon(r){const url=iconUrl(r.league_icon);return url?'<img class="league-icon" src="'+esc(url)+'" alt="">':'<span class="league-icon">'+esc(initials(r.league_name))+'</span>'}
function delta(v){if(v==null)return'<span class="unknown">-</span>';const n=Number(v);if(!Number.isFinite(n))return'<span class="unknown">-</span>';if(n>0)return'<span class="positive">+'+shortNum(n)+'</span>';if(n<0)return'<span class="negative">'+shortNum(n)+'</span>';return'<span class="zero">0</span>'}
function compare(a,b,k,asc){const an=Number(a[k]),bn=Number(b[k]);let r=Number.isFinite(an)&&Number.isFinite(bn)?an-bn:String(a[k]||"").localeCompare(String(b[k]||""));return asc?r:-r}
function setStatus(text){document.getElementById("status").textContent=text}
function norm(v){return String(v||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"")}
function isFallbackName(name,userId){const text=String(name||"").trim();const id=String(userId||"").trim();return !text||(id&&text===id)||/^user_\d+$/i.test(text)}
function bestName(userId,...values){const known=knownPlayers.get(String(userId));const names=[known?.username,...values].map(value=>String(value||"").trim()).filter(Boolean);return names.find(name=>!isFallbackName(name,userId))||names[0]||String(userId||"")}
async function loadKnownPlayers(){try{const res=await fetch("Data/player-index.json?v="+Date.now(),{cache:"no-store"});if(!res.ok)return;const rows=await res.json();knownPlayers=new Map((Array.isArray(rows)?rows:[]).filter(row=>row.user_id).map(row=>[String(row.user_id),row]))}catch{}}
function memberUserId(row){return String(row?.user_id??row?.userId??row?.UserID??row?.UserId??row?.id??"").trim()}
function rememberPlayer(row){const userId=memberUserId(row);if(!userId)return;const existing=knownPlayers.get(userId)||{};knownPlayers.set(userId,{...existing,user_id:userId,username:row?.username||row?.Username||existing.username,display_name:row?.display_name||row?.displayName||row?.DisplayName||existing.display_name})}
async function loadKnownC0ldMembers(){
  const ids=new Set(COLD_MEMBER_OVERRIDE_IDS);
  try{
    const url=new URL(CLAN_LOOKUP_API);
    url.searchParams.set("clan","c0ld");
    url.searchParams.set("v",Date.now());
    const data=await getJson(url);
    const rows=Array.isArray(data.members)?data.members:[];
    rows.forEach(row=>{const id=memberUserId(row);if(id)ids.add(id);rememberPlayer(row)});
    if(ids.size>COLD_MEMBER_OVERRIDE_IDS.size){knownC0ldMembers=ids;return}
  }catch{}
  try{
    const url=new URL(CLAN_API+"/api/current");
    url.searchParams.set("clan","c0ld");
    url.searchParams.set("v",Date.now());
    const data=await getJson(url);
    (data.rows||[]).forEach(row=>{const id=memberUserId(row);if(id)ids.add(id);rememberPlayer(row)});
  }catch{}
  knownC0ldMembers=ids;
}
function isKnownC0ldMember(userId){return knownC0ldMembers.has(String(userId))}
function getMode(){return document.getElementById("view-mode").value==="members"?"members":"leagues"}
function scoreDesc(a,b){return (Number(b.points)||0)-(Number(a.points)||0)}
function rankMembers(rows){return rows.slice().sort(scoreDesc).map((row,index)=>({...row,score_rank:index+1}))}
function trackedLeagueFor(row){return TRACKED_LEAGUES.find(entry=>String(row.league_id||"")===String(entry.id)||norm(row.league_name)===norm(entry.name))||null}
function leaguePage(row){const entry=row.page?row:trackedLeagueFor(row);return entry?.page||"league-profile.html?league="+encodeURIComponent(row.league_name||"")}
function memberPills(matches){return (matches||[]).map(m=>'<span class="member-pill" title="League rank #'+esc(m.rank||"-")+'"><strong>'+esc(bestName(m.user_id,m.username,m.display_name))+'</strong> '+esc(shortNum(m.points))+'</span>').join("")}
async function getJson(url){url.searchParams.set("v",Date.now());const res=await fetch(url,{cache:"no-store"});const data=await res.json();if(!res.ok||data.ok===false)throw new Error(data.message||"HTTP "+res.status);return data}
function addRun(url){if(RUN_KEY)url.searchParams.set("run",RUN_KEY);return url}
async function fetchLeagueCurrent(entry){const url=new URL(API+"/api/leagues/current");url.searchParams.set("league",entry.apiName||entry.name);url.searchParams.set("rank_lookup","false");addRun(url);return getJson(url)}
function finiteOrNull(v){const n=Number(v);return Number.isFinite(n)?n:null}
function sumCurrentGain(current,key){const values=(current?.rows||[]).map(row=>finiteOrNull(row[key])).filter(value=>value!==null);if(!values.length)return null;return values.reduce((sum,value)=>sum+value,0)}
function leagueBase(entry,current){return {rank:entry.rank??current?.league_rank??null,league_name:current?.league_name||entry.name,league_id:current?.league_id||entry.id,league_icon:current?.league_icon||null,page:entry.page||null,points:finiteOrNull(current?.league_points)??0,gain_1h:sumCurrentGain(current,"gain_1h"),gain_6h:sumCurrentGain(current,"gain_6h"),gain_12h:sumCurrentGain(current,"gain_12h"),gain_24h:sumCurrentGain(current,"gain_24h"),c0ld_member_count:0,matches:[],snapshot_at:current?.snapshot_at||null}}
function matchesFromCurrent(current){return (current?.rows||[]).filter(row=>isKnownC0ldMember(row.user_id)).map(row=>({user_id:row.user_id,username:bestName(row.user_id,row.username,row.display_name),display_name:row.display_name,rank:row.rank,points:finiteOrNull(row.total_points)??finiteOrNull(row.points)??0,gain_1h:finiteOrNull(row.gain_1h),gain_6h:finiteOrNull(row.gain_6h),gain_12h:finiteOrNull(row.gain_12h),gain_24h:finiteOrNull(row.gain_24h)})).sort((a,b)=>(Number(b.points)||0)-(Number(a.points)||0))}
function buildStoredLeague(entry,current){const matches=matchesFromCurrent(current);return {...leagueBase(entry,current),c0ld_member_count:matches.length,matches}}
function tableHeaders(){const leagues='<tr><th data-sort="rank">Rank</th><th data-sort="league_name">League</th><th data-sort="points" class="numeric">Points</th><th data-sort="gain_1h" class="numeric">1 Hr</th><th data-sort="gain_6h" class="numeric">6 Hrs</th><th data-sort="gain_12h" class="numeric">12 Hrs</th><th data-sort="gain_24h" class="numeric">24 Hrs</th><th>c0ld Members</th></tr>';const members='<tr><th>Rank</th><th>Player</th><th>League</th><th class="numeric">Points</th><th class="numeric">1 Hr</th><th class="numeric">6 Hrs</th><th class="numeric">12 Hrs</th><th class="numeric">24 Hrs</th></tr>';document.getElementById("thead").innerHTML=getMode()==="members"?members:leagues;document.querySelectorAll("th[data-sort]").forEach(th=>th.addEventListener("click",()=>{const k=th.dataset.sort;if(sortKey===k)sortAsc=!sortAsc;else{sortKey=k;sortAsc=k==="rank"||k==="league_name"||k==="username"}render()}))}
function visible(){const q=document.getElementById("search-input").value.trim().toLowerCase();let list=(getMode()==="members"?memberRows:leagueRows).slice();if(q)list=list.filter(row=>String(row.league_name||"").toLowerCase().includes(q)||String(row.username||"").toLowerCase().includes(q)||(row.matches||[]).some(m=>String(m.username||m.user_id).toLowerCase().includes(q)));if(getMode()==="members")return list.sort(scoreDesc);list.sort((a,b)=>compare(a,b,sortKey,sortAsc));return list}
function countRankRange(min,max){return leagueRows.filter(r=>{const rank=Number(r.rank);return Number.isFinite(rank)&&rank>=min&&rank<=max}).length}
function renderCards(){document.getElementById("top60-count").textContent=countRankRange(1,60).toLocaleString("en-US");document.getElementById("top250-count").textContent=countRankRange(61,250).toLocaleString("en-US");document.getElementById("top750-count").textContent=countRankRange(251,750).toLocaleString("en-US");document.getElementById("top1400-count").textContent=countRankRange(751,1400).toLocaleString("en-US");document.getElementById("top3300-count").textContent=countRankRange(1401,3300).toLocaleString("en-US");document.getElementById("top8500-count").textContent=countRankRange(3301,8500).toLocaleString("en-US");document.getElementById("top10000-count").textContent=countRankRange(8501,10000).toLocaleString("en-US")}
function renderMeta(){const updated=lastUpdated?" · League data updated "+dt(lastUpdated):"";document.getElementById("table-meta").textContent=(errors.length?errors.length+" league load errors · ":"")+leagueRows.length+" static leagues · "+memberRows.length+" c0ld members"+updated}
function renderLeagues(list){const tbody=document.getElementById("tbody");if(!list.length){tbody.innerHTML='<tr><td colspan="8" class="empty">No tracked c0ld leagues found yet.</td></tr>';return}tbody.innerHTML=list.map(r=>'<tr><td class="rank">'+(r.rank?"#"+esc(r.rank):"-")+'</td><td><div class="league-cell">'+leagueIcon(r)+'<span><a href="'+esc(leaguePage(r))+'">'+esc(r.league_name||"-")+'</a><div class="subtle">'+esc(r.league_id||"no league id")+'</div></span></div></td><td class="numeric" title="'+esc(fullNum(r.points))+'">'+esc(shortNum(r.points))+'</td><td class="numeric">'+delta(r.gain_1h)+'</td><td class="numeric">'+delta(r.gain_6h)+'</td><td class="numeric">'+delta(r.gain_12h)+'</td><td class="numeric">'+delta(r.gain_24h)+'</td><td><div class="members">'+memberPills(r.matches)+'</div></td></tr>').join("")}
function renderMembers(list){const tbody=document.getElementById("tbody");if(!list.length){tbody.innerHTML='<tr><td colspan="8" class="empty">No c0ld members found in the tracked leagues yet.</td></tr>';return}tbody.innerHTML=list.map((r,index)=>'<tr><td class="rank">#'+esc(r.score_rank||index+1)+'</td><td><a href="'+esc(leaguePage(r))+'"><strong>'+esc(bestName(r.user_id,r.username,r.display_name))+'</strong></a><div class="subtle">'+esc(r.user_id||"")+'</div></td><td><a href="'+esc(leaguePage(r))+'">'+esc(r.league_name||"-")+'</a></td><td class="numeric" title="'+esc(fullNum(r.points))+'">'+esc(shortNum(r.points))+'</td><td class="numeric">'+delta(r.gain_1h)+'</td><td class="numeric">'+delta(r.gain_6h)+'</td><td class="numeric">'+delta(r.gain_12h)+'</td><td class="numeric">'+delta(r.gain_24h)+'</td></tr>').join("")}
function render(){tableHeaders();document.getElementById("section-title").textContent=getMode()==="members"?"c0ld Members":"c0ld Leagues";const list=visible();getMode()==="members"?renderMembers(list):renderLeagues(list);renderCards();renderMeta()}
async function loadData(){
  if(loading)return;loading=true;errors=[];document.getElementById("refresh-btn").disabled=true;
  try{
    setStatus("Refreshing stored data for the static c0ld league list...");
    await Promise.all([loadKnownPlayers(),loadKnownC0ldMembers()]);
    leagueRows=TRACKED_LEAGUES.map(entry=>leagueBase(entry,null)).sort((a,b)=>(Number(a.rank)||999999)-(Number(b.rank)||999999));
    memberRows=[];
    render();
    const built=await Promise.all(TRACKED_LEAGUES.map(async entry=>{
      try{
        const current=await fetchLeagueCurrent(entry);
        return buildStoredLeague(entry,current);
      }catch(err){
        errors.push({league:entry.name,message:err.message||String(err)});
        return leagueBase(entry,null);
      }
    }));
    leagueRows=built.sort((a,b)=>(Number(a.rank)||999999)-(Number(b.rank)||999999));
    lastUpdated=leagueRows.map(row=>row.snapshot_at).filter(Boolean).sort().pop()||null;
    memberRows=rankMembers(leagueRows.flatMap(row=>row.matches.map(member=>({...member,league_name:row.league_name,league_id:row.league_id,league_icon:row.league_icon,league_rank:row.rank,page:row.page}))));
    setStatus("Showing "+leagueRows.length.toLocaleString("en-US")+" static c0ld leagues from stored league pulls.");
    render();
  }catch(err){
    console.error(err);
    setStatus("Could not load c0ld leagues: "+(err.message||String(err)));
    document.getElementById("tbody").innerHTML='<tr><td colspan="8" class="error">'+esc(err.message||String(err))+'</td></tr>';
  }finally{
    loading=false;
    document.getElementById("refresh-btn").disabled=false;
  }
}
document.getElementById("refresh-btn").addEventListener("click",loadData);
document.getElementById("view-mode").addEventListener("change",()=>{if(getMode()==="members"){sortKey="points";sortAsc=false}else{sortKey="rank";sortAsc=true}render()});
document.getElementById("search-input").addEventListener("input",render);
loadData();
setInterval(loadData,REFRESH_INTERVAL_MS);
</script>
<script src="assets/site-announcement.js"></script>
