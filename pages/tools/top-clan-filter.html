<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Top Clans Filter</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #0f141b;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --link: #ff9b96;
      --hover: #1f2630;
      --danger: #f85149;
      --danger-bg: rgba(248,81,73,0.12);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: none; }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 22px 10px;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .site-logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }

    .site-logo {
      display: block;
      width: 76px;
      height: auto;
      border-radius: 10px;
    }

    .title-wrap h1 {
      margin: 0 0 3px;
      font-size: 27px;
      line-height: 1.1;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .github-btn {
      display: inline-block;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
      white-space: nowrap;
    }

    .menu-bar {
      max-width: 1280px;
      margin: 9px auto 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .menu-btn {
      display: inline-block;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 13px;
      line-height: 1;
    }

    .menu-btn.active {
      border-color: var(--link);
      color: var(--link);
      background: rgba(88,166,255,0.08);
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px 24px 28px;
    }

    .status {
      margin-bottom: 18px;
      border-radius: 10px;
      padding: 14px 16px;
      display: none;
    }

    .status.info {
      display: block;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
    }

    .status.error {
      display: block;
      border: 1px solid var(--danger);
      background: var(--danger-bg);
      color: #ffb4ad;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
    }

    .card-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 12px;
      font-size: 20px;
      font-weight: 700;
      outline: none;
    }

    .card-input:focus {
      border-color: var(--link);
      background: var(--hover);
    }

    .controls-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn:hover {
      border-color: var(--link);
      background: var(--hover);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .section-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .section-title {
      margin: 0;
      font-size: 18px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1180px;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      vertical-align: middle;
    }

    th {
      text-align: left;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    tbody tr:hover {
      background: rgba(255,255,255,0.02);
    }

    tbody tr.clickable-row {
      cursor: pointer;
    }

    tbody tr.clickable-row:hover {
      background: var(--hover);
    }

    .numeric {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .activity-start {
      border-left: 1px solid var(--border);
    }

    .activity-divider {
      border-left: 1px solid var(--border);
    }

    .activity-end {
      border-right: 1px solid var(--border);
    }

    .sort-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }

    .sort-btn.numeric {
      text-align: right;
    }

    .sort-btn:hover,
    .sort-btn.active {
      color: var(--text);
    }

    .sort-mark {
      margin-left: 4px;
      color: var(--link);
      font-size: 11px;
    }

    .clan-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
    }

    .clan-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #21262d;
      object-fit: cover;
      flex: 0 0 auto;
    }

    .empty-state {
      color: var(--muted);
      padding: 20px 18px;
    }

    .row-error {
      color: var(--danger);
      font-size: 12px;
      font-weight: 400;
      margin-top: 4px;
      max-width: 340px;
      white-space: normal;
    }

    .card-help {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.3;
    }

    @media (max-width: 1050px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      header { padding: 14px 16px 10px; }
      main { padding: 16px; }
      .title-wrap h1 { font-size: 24px; }
      .cards { grid-template-columns: 1fr; }
      .controls-row { justify-content: stretch; }
      .controls-row .btn { width: 100%; }
      .card-input { font-size: 18px; }
      .menu-bar { justify-content: flex-start; }
    }
  .lookup-menu{position:relative;display:inline-block}
.lookup-menu>summary{list-style:none;cursor:pointer}
.lookup-menu>summary::-webkit-details-marker{display:none}
.menu .lookup-summary,.menu-bar .lookup-summary{display:inline-block;padding:7px 12px;border:1px solid var(--border,#30363d);border-radius:5px;background:var(--panel-2,#0f141b);color:var(--text,#e6edf3);font-size:13px;line-height:1}
.menu .lookup-summary.active,.menu-bar .lookup-summary.active{border-color:var(--link,#ff9b96);color:var(--link,#ff9b96);background:rgba(248,81,73,.12)}
.lookup-menu-list{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:50;min-width:165px;padding:6px;border:1px solid var(--border,#30363d);border-radius:8px;background:var(--panel,#161b22);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.lookup-menu[open] .lookup-menu-list{display:flex;flex-direction:column;gap:4px}
.lookup-menu-list a{display:block;white-space:nowrap;text-align:left}
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="site-logo-link" href="index.html" aria-label="c0ld home">
        <img class="site-logo" src="assets/c0ld-kitsune-logo.gif" alt="c0ld">
      </a>
    </div>

    <div class="menu-bar">
      <a class="menu-btn" href="index.html">c0ld Leaderboard</a>
      <a class="menu-btn" href="clans.html">Clans Leaderboard</a>
      <a class="menu-btn" href="global-leaderboard.html">Global Leaderboard</a>
<details class="lookup-menu">
      <summary class="menu-btn lookup-summary active">Tools</summary>
      <div class="lookup-menu-list">
        <a class="menu-btn active" href="top-clan-filter.html">Top Clan Filter</a>
        <a class="menu-btn" href="live-clan.html">Clan Lookup</a>
        <a class="menu-btn" href="player-lookup.html">Profile Lookup</a>
      </div>
    </details>
    </div>
  </header>

  <main>
    <div id="status" class="status"></div>

    <section class="cards">
      <div class="card">
        <div class="label">Current Battle</div>
        <div class="value" id="card-battle">—</div>
      </div>

      <div class="card">
        <div class="label"># of Top Clans</div>
        <input id="top-input" class="card-input" type="text" value="10" />
      </div>

      <div class="card">
        <div class="label">Filter 1</div>
        <input id="filter1-input" class="card-input" type="text" value="100" />
      </div>

      <div class="card">
        <div class="label">Filter 2</div>
        <input id="filter2-input" class="card-input" type="text" value="90" />
      </div>

      <div class="card">
        <div class="label">Filter 3</div>
        <input id="filter3-input" class="card-input" type="text" value="75" />
      </div>
    </section>

    <div class="controls-row">
      <button id="refresh-btn" class="btn" type="button">Refresh</button>
    </div>

    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Top Clans Filtered</h2>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr id="table-head-row">
              <th>Rank</th>
              <th>Clan</th>
              <th class="numeric">Points</th>
              <th class="numeric activity-start">Active</th>
              <th class="numeric activity-divider activity-end">Hatching</th>
              <th class="numeric">100+</th>
              <th class="numeric">90+</th>
              <th class="numeric">75+</th>
              <th class="numeric">Under 75</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <td colspan="9" class="empty-state">No data loaded yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const THRESHOLDS_URL = "https://c0ld-clan-api-worker.opal-dde.workers.dev/api/top-clan-thresholds";
    const DEFAULT_FILTERS = { filter1: 100, filter2: 90, filter3: 75 };
    let currentPayload = null;
    let sortState = { key: "filter1", direction: "desc" };
    const DEFAULT_CLAN_ICON =
      "data:image/svg+xml;utf8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
          <rect width="64" height="64" rx="12" fill="#21262d"/>
          <path d="M20 44V24l12-6 12 6v20l-12 6-12-6z" fill="#6e7681"/>
        </svg>
      `);

    const STORAGE_KEYS = {
      top: "ps99_top_clan_member_thresholds_top",
      filter1: "ps99_top_clan_rebirth_filter_1",
      filter2: "ps99_top_clan_rebirth_filter_2",
      filter3: "ps99_top_clan_rebirth_filter_3"
    };

    function htmlEscape(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function stripZeros(value) {
      return String(value).replace(/\.00$/, "").replace(/(\.\d*[1-9])0+$/, "$1");
    }

    function formatCompactNumber(value) {
      if (value === null || value === undefined || value === "") return "—";
      const n = Number(value);
      if (Number.isNaN(n)) return "—";

      const abs = Math.abs(n);

      if (abs >= 1e12) return stripZeros((n / 1e12).toFixed(2)) + "T";
      if (abs >= 1e9) return stripZeros((n / 1e9).toFixed(2)) + "B";
      if (abs >= 1e6) return stripZeros((n / 1e6).toFixed(2)) + "M";
      if (abs >= 1e3) return stripZeros((n / 1e3).toFixed(2)) + "K";

      return String(Math.round(n));
    }

    function fmtShortNumber(value) {
      if (value === null || value === undefined || value === "") return "—";
      const n = Number(value);
      if (Number.isNaN(n)) return "—";

      const abs = Math.abs(n);
      if (abs >= 1e12) return stripZeros((n / 1e12).toFixed(2)) + "T";
      if (abs >= 1e9) return stripZeros((n / 1e9).toFixed(2)) + "B";
      if (abs >= 1e6) return stripZeros((n / 1e6).toFixed(2)) + "M";
      if (abs >= 1e3) return stripZeros((n / 1e3).toFixed(2)) + "K";

      return n.toLocaleString("en-US");
    }

    function setStatus(text = "", kind = "info") {
      const el = document.getElementById("status");

      if (!text) {
        el.className = "status";
        el.textContent = "";
        return;
      }

      el.className = `status ${kind}`;
      el.textContent = text;
    }

    function parseFlexibleNumber(value) {
      const raw = String(value || "").trim();
      if (!raw) return null;

      const cleaned = raw.replace(/,/g, "").replace(/\s+/g, "").toUpperCase();
      const match = cleaned.match(/^(\d+(?:\.\d+)?)([KMBT])?$/);

      if (!match) return null;

      const base = Number(match[1]);
      if (!Number.isFinite(base)) return null;

      const suffix = match[2] || "";
      const multipliers = {
        "": 1,
        K: 1e3,
        M: 1e6,
        B: 1e9,
        T: 1e12
      };

      const result = Math.round(base * (multipliers[suffix] || 1));
      return Number.isFinite(result) ? result : null;
    }

    function parseTopCount(value) {
      const n = parseFlexibleNumber(value);
      if (!Number.isFinite(n)) return null;
      return Math.min(Math.max(Math.round(n), 1), 25);
    }

    function parseRebirthThreshold(value) {
      const raw = String(value || "").trim();
      if (!raw) return null;

      const cleaned = raw.replace(/,/g, "").replace(/\s+/g, "").replace(/\+$/, "");
      const n = Number(cleaned);
      return Number.isFinite(n) ? n : null;
    }

    function formatRebirthThreshold(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "";
      return stripZeros(n.toFixed(2));
    }

    function saveInputs(top, filter1, filter2, filter3) {
      localStorage.setItem(STORAGE_KEYS.top, String(top));
      localStorage.setItem(STORAGE_KEYS.filter1, String(filter1));
      localStorage.setItem(STORAGE_KEYS.filter2, String(filter2));
      localStorage.setItem(STORAGE_KEYS.filter3, String(filter3));
    }

    function loadSavedInputs() {
      const top = localStorage.getItem(STORAGE_KEYS.top);
      const filter1 = localStorage.getItem(STORAGE_KEYS.filter1);
      const filter2 = localStorage.getItem(STORAGE_KEYS.filter2);
      const filter3 = localStorage.getItem(STORAGE_KEYS.filter3);

      if (top) document.getElementById("top-input").value = top;
      if (filter1) document.getElementById("filter1-input").value = filter1;
      if (filter2) document.getElementById("filter2-input").value = filter2;
      if (filter3) document.getElementById("filter3-input").value = filter3;
    }

    function loadQueryInputs() {
      const params = new URLSearchParams(window.location.search);
      const top = params.get("top");
      const filter1 = params.get("filter1");
      const filter2 = params.get("filter2");
      const filter3 = params.get("filter3");

      if (top) document.getElementById("top-input").value = top;
      if (filter1) document.getElementById("filter1-input").value = filter1;
      if (filter2) document.getElementById("filter2-input").value = filter2;
      if (filter3) document.getElementById("filter3-input").value = filter3;
    }

    function normalizeInputDisplays() {
      const topRaw = document.getElementById("top-input").value;
      const filter1Raw = document.getElementById("filter1-input").value;
      const filter2Raw = document.getElementById("filter2-input").value;
      const filter3Raw = document.getElementById("filter3-input").value;

      const top = parseTopCount(topRaw);
      const filter1 = parseRebirthThreshold(filter1Raw);
      const filter2 = parseRebirthThreshold(filter2Raw);
      const filter3 = parseRebirthThreshold(filter3Raw);

      if (Number.isFinite(top)) {
        document.getElementById("top-input").value = String(top);
      }

      if (Number.isFinite(filter1)) {
        document.getElementById("filter1-input").value = formatRebirthThreshold(filter1);
      }

      if (Number.isFinite(filter2)) {
        document.getElementById("filter2-input").value = formatRebirthThreshold(filter2);
      }

      if (Number.isFinite(filter3)) {
        document.getElementById("filter3-input").value = formatRebirthThreshold(filter3);
      }
    }

    function renderCards(payload) {
      document.getElementById("card-battle").textContent =
        payload?.activeBattle?.configName || payload?.display_name || payload?.battle || "—";

      document.getElementById("top-input").value =
        String(payload?.top || document.getElementById("top-input").value || "10");

      document.getElementById("filter1-input").value = formatRebirthThreshold(
        payload?.filter1Threshold || parseRebirthThreshold(document.getElementById("filter1-input").value) || DEFAULT_FILTERS.filter1
      );

      document.getElementById("filter2-input").value = formatRebirthThreshold(
        payload?.filter2Threshold || parseRebirthThreshold(document.getElementById("filter2-input").value) || DEFAULT_FILTERS.filter2
      );

      document.getElementById("filter3-input").value = formatRebirthThreshold(
        payload?.filter3Threshold || parseRebirthThreshold(document.getElementById("filter3-input").value) || DEFAULT_FILTERS.filter3
      );
    }

    function sortMark(key) {
      if (sortState.key !== key) return "";
      return `<span class="sort-mark">[sorted]</span>`;
    }

    function sortHeader(key, label, numeric = false) {
      const active = sortState.key === key ? " active" : "";
      const cls = numeric ? "sort-btn numeric" : "sort-btn";
      return `<button class="${cls}${active}" type="button" data-sort="${htmlEscape(key)}">${htmlEscape(label)}${sortMark(key)}</button>`;
    }

    function rowMetrics(row) {
      const filter1Count = Number(row.filter1_count ?? row.elite_count ?? 0);
      const filter2Count = Number(row.filter2_count ?? row.high_count ?? 0);
      const filter3Count = Number(row.filter3_count ?? row.low_count ?? 0);
      const memberCount = Number(row.member_count || 0);
      const underCount = Number.isFinite(Number(row.under_filter3_count))
        ? Number(row.under_filter3_count)
        : Number.isFinite(Number(row.below_low_count))
          ? Number(row.below_low_count)
          : Math.max(0, memberCount - filter1Count - filter2Count - filter3Count);

      return {
        rank: Number(row.rank || 999999),
        clan: String(row.clan_name || "").toLowerCase(),
        points: Number(row.battle_points ?? row.points ?? row.clan_points ?? 0),
        active: Number(row.active_count || 0),
        hatching: Number(row.hatching_count || 0),
        filter1: filter1Count,
        filter2: filter2Count,
        filter3: filter3Count,
        under: underCount
      };
    }

    function sortedRows(rows) {
      const direction = sortState.direction === "asc" ? 1 : -1;

      return rows.slice().sort((a, b) => {
        const am = rowMetrics(a);
        const bm = rowMetrics(b);
        const av = am[sortState.key];
        const bv = bm[sortState.key];

        if (sortState.key === "clan") {
          const textCmp = String(av).localeCompare(String(bv));
          if (textCmp) return textCmp * direction;
        } else if (av !== bv) {
          return (Number(av) - Number(bv)) * direction;
        }

        if (am.rank !== bm.rank) return am.rank - bm.rank;
        return am.clan.localeCompare(bm.clan);
      });
    }

    function buildDetailUrl(row, payload) {
      const url = new URL("top-clan-filter-detail.html", window.location.href);
      url.searchParams.set("clan", row.clan_name || "");
      url.searchParams.set("top", String(payload?.top || document.getElementById("top-input").value || "10"));
      url.searchParams.set("filter1", String(payload?.filter1Threshold || DEFAULT_FILTERS.filter1));
      url.searchParams.set("filter2", String(payload?.filter2Threshold || DEFAULT_FILTERS.filter2));
      url.searchParams.set("filter3", String(payload?.filter3Threshold || DEFAULT_FILTERS.filter3));
      return url.toString();
    }

    function wireDetailRows() {
      document.querySelectorAll("[data-detail-url]").forEach(row => {
        row.addEventListener("click", () => {
          const url = row.dataset.detailUrl;
          if (url) window.location.href = url;
        });
      });
    }

    function wireSortHeaders() {
      document.querySelectorAll("[data-sort]").forEach(button => {
        button.addEventListener("click", () => {
          const key = button.dataset.sort;
          if (!key) return;

          if (sortState.key === key) {
            sortState = {
              key,
              direction: sortState.direction === "desc" ? "asc" : "desc"
            };
          } else {
            sortState = {
              key,
              direction: key === "rank" || key === "clan" ? "asc" : "desc"
            };
          }

          if (currentPayload) renderTable(currentPayload);
        });
      });
    }

    function renderTable(payload) {
      currentPayload = payload;
      const tbody = document.getElementById("tbody");
      const rows = Array.isArray(payload?.rows) ? payload.rows : [];

      const filter1Label = formatRebirthThreshold(payload?.filter1Threshold || DEFAULT_FILTERS.filter1);
      const filter2Label = formatRebirthThreshold(payload?.filter2Threshold || DEFAULT_FILTERS.filter2);
      const filter3Label = formatRebirthThreshold(payload?.filter3Threshold || DEFAULT_FILTERS.filter3);

      document.getElementById("table-head-row").innerHTML = `
        <th>${sortHeader("rank", "Rank")}</th>
        <th>${sortHeader("clan", "Clan")}</th>
        <th class="numeric">${sortHeader("points", "Points", true)}</th>
        <th class="numeric activity-start">${sortHeader("active", "Active", true)}</th>
        <th class="numeric activity-divider activity-end">${sortHeader("hatching", "Hatching", true)}</th>
        <th class="numeric">${sortHeader("filter1", `${filter1Label}+`, true)}</th>
        <th class="numeric">${sortHeader("filter2", `${filter2Label}+`, true)}</th>
        <th class="numeric">${sortHeader("filter3", `${filter3Label}+`, true)}</th>
        <th class="numeric">${sortHeader("under", `Under ${filter3Label}`, true)}</th>
      `;
      wireSortHeaders();

      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="9" class="empty-state">No rows returned.</td></tr>`;
        return;
      }

      tbody.innerHTML = sortedRows(rows).map(row => {
        const metrics = rowMetrics(row);
        const detailUrl = buildDetailUrl(row, payload);

        return `
          <tr class="clickable-row" data-detail-url="${htmlEscape(detailUrl)}">
            <td>#${htmlEscape(row.rank)}</td>
            <td>
              <div class="clan-cell">
                <img class="clan-icon" src="${htmlEscape(row.icon_url || DEFAULT_CLAN_ICON)}" alt=""
                     loading="lazy"
                     onerror="this.onerror=null;this.src='${DEFAULT_CLAN_ICON}';">
                <span>
                  <span>${htmlEscape(row.clan_name)}</span>
                  ${row.error ? `<div class="row-error">${htmlEscape(row.error)}</div>` : ""}
                </span>
              </div>
            </td>
            <td class="numeric">${fmtShortNumber(metrics.points)}</td>
            <td class="numeric activity-start">${htmlEscape(metrics.active)}</td>
            <td class="numeric activity-divider activity-end">${htmlEscape(metrics.hatching)}</td>
            <td class="numeric">${htmlEscape(metrics.filter1)}</td>
            <td class="numeric">${htmlEscape(metrics.filter2)}</td>
            <td class="numeric">${htmlEscape(metrics.filter3)}</td>
            <td class="numeric">${htmlEscape(metrics.under)}</td>
          </tr>
        `;
      }).join("");
      wireDetailRows();
    }

    function getParsedInputs() {
      const top = parseTopCount(document.getElementById("top-input").value);
      const filter1 = parseRebirthThreshold(document.getElementById("filter1-input").value);
      const filter2 = parseRebirthThreshold(document.getElementById("filter2-input").value);
      const filter3 = parseRebirthThreshold(document.getElementById("filter3-input").value);

      if (!Number.isFinite(top)) {
        throw new Error("Top Clans Scanned must be a whole number between 1 and 25.");
      }

      if (!Number.isFinite(filter1)) {
        throw new Error("Filter 1 is invalid. Try values like 100, 90, or 75.");
      }

      if (!Number.isFinite(filter2)) {
        throw new Error("Filter 2 is invalid. Try values like 100, 90, or 75.");
      }

      if (!Number.isFinite(filter3)) {
        throw new Error("Filter 3 is invalid. Try values like 100, 90, or 75.");
      }

      if (!(filter1 > filter2 && filter2 > filter3)) {
        throw new Error("Filters must be ordered from highest to lowest: Filter 1 > Filter 2 > Filter 3.");
      }

      return { top, filter1, filter2, filter3 };
    }

    function buildThresholdUrl(baseUrl, top, filter1, filter2, filter3) {
      const url = new URL(baseUrl);
      url.searchParams.set("top", String(top));
      url.searchParams.set("filter1", String(filter1));
      url.searchParams.set("filter2", String(filter2));
      url.searchParams.set("filter3", String(filter3));
      return url.toString();
    }

    async function fetchJsonOrThrow(url) {
      const res = await fetch(url, { cache: "no-store" });
      const text = await res.text();
      let payload = null;

      try {
        payload = text ? JSON.parse(text) : null;
      } catch {
        payload = null;
      }

      if (!res.ok) {
        throw new Error(payload?.message || payload?.error || text || `Worker request failed (${res.status}).`);
      }

      if (payload?.ok === false) {
        throw new Error(payload?.message || payload?.error || "Lookup failed.");
      }

      return payload;
    }

    async function fetchThresholds(top, filter1, filter2, filter3) {
      return fetchJsonOrThrow(buildThresholdUrl(THRESHOLDS_URL, top, filter1, filter2, filter3));
    }

    async function loadThresholds() {
      let parsed;

      try {
        parsed = getParsedInputs();
      } catch (err) {
        setStatus(err?.message || String(err), "error");
        return;
      }

      const { top, filter1, filter2, filter3 } = parsed;

      saveInputs(String(top), formatRebirthThreshold(filter1), formatRebirthThreshold(filter2), formatRebirthThreshold(filter3));
      normalizeInputDisplays();
      setStatus("Loading top clan rebirth counts...", "info");

      try {
        const payload = await fetchThresholds(top, filter1, filter2, filter3);

        renderCards(payload);
        renderTable(payload);
        saveInputs(
          String(payload.top || top),
          formatRebirthThreshold(payload.filter1Threshold || filter1),
          formatRebirthThreshold(payload.filter2Threshold || filter2),
          formatRebirthThreshold(payload.filter3Threshold || filter3)
        );
        setStatus("", "info");
      } catch (err) {
        console.error(err);
        setStatus(err?.message || String(err), "error");
      }
    }

    async function postThresholds() {
      setStatus("Discord posting is not configured for rebirth filters yet.", "error");
    }

    async function postThresholdImageBoard() {
      setStatus("Discord image posting is not configured for rebirth filters yet.", "error");
    }

    function wireEvents() {
      document.getElementById("refresh-btn").addEventListener("click", loadThresholds);

      const postBtn = document.getElementById("post-btn");
      if (postBtn) postBtn.addEventListener("click", postThresholds);

      const postImageBtn = document.getElementById("post-image-btn");
      if (postImageBtn) postImageBtn.addEventListener("click", postThresholdImageBoard);

      ["top-input", "filter1-input", "filter2-input", "filter3-input"].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;

        el.addEventListener("keydown", e => {
          if (e.key === "Enter") {
            loadThresholds();
          }
        });

        el.addEventListener("blur", () => {
          normalizeInputDisplays();
        });
      });
    }

    function init() {
      loadSavedInputs();
      loadQueryInputs();
      normalizeInputDisplays();
      wireEvents();
      loadThresholds();
    }

    init();
  </script>
</body>
</html>
