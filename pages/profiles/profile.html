<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player Profile</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#0d1117;--panel:#161b22;--panel2:#0d1117;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--link:#58a6ff;--rank:#f2cc60}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    a{color:var(--link);text-decoration:none}
    header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 22px}
    .header-inner{max-width:1200px;margin:auto;display:flex;justify-content:center}
    .site-logo{width:76px;border-radius:10px}
    .menu-bar{max-width:1200px;margin:9px auto 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .menu-btn{padding:7px 12px;border:1px solid var(--border);border-radius:5px;background:var(--panel2);color:var(--text);font-size:13px}
    .menu-btn:hover,.menu-btn.active{border-color:var(--link);color:var(--link);background:#1f2630}
    main{max-width:1200px;margin:auto;padding:22px 24px}
    body.embedded{background:transparent}
    body.embedded header{display:none}
    body.embedded main{max-width:none;padding:0}
    body.embedded .profile-header{margin-top:0}
    .profile-header,.card,.battle-card,.empty,.error{border:1px solid var(--border);border-radius:10px;background:var(--panel)}
    .profile-header{display:flex;gap:18px;align-items:center;padding:18px;margin-bottom:24px}
    .avatar{width:96px;height:96px;border-radius:10px;background:#21262d;object-fit:cover}
    .profile-name{margin:0 0 6px;font-size:34px}
    .profile-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
    .profile-action{appearance:none;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
    .profile-action:hover,.profile-action:focus{border-color:var(--link);color:var(--link);background:#1f2630}
    .meta,.label,.dates,.chart-title,.muted{color:var(--muted);font-size:13px;line-height:1.45}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:14px}
    .card{padding:16px;min-height:82px}
    .value{font-size:21px;font-weight:700;overflow-wrap:anywhere}
    .battle-detail-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.85fr);gap:16px;align-items:start}
    .battle-detail-grid>.battle-card:only-child{grid-column:1/-1}
    .reward-card{border:1px solid var(--border);border-radius:10px;background:var(--panel);overflow:hidden}
    .reward-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:16px;border-bottom:1px solid var(--border)}
    .reward-card-title{margin:2px 0 0;font-size:20px}
    .reward-total{flex:0 0 auto;border:1px solid rgba(126,231,135,.35);border-radius:999px;background:rgba(46,160,67,.14);color:#7ee787;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
    .reward-rank-context{padding:10px 16px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px;line-height:1.4}
    .reward-items{display:grid;padding:6px 14px}
    .reward-item{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;min-height:62px;padding:9px 2px;border-top:1px solid rgba(139,148,158,.22);opacity:.56}
    .reward-item:first-child{border-top:0}
    .reward-item.eligible{opacity:1}
    .reward-item.unknown{opacity:.78}
    .reward-icon{width:46px;height:46px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);object-fit:contain}
    .reward-item-copy{min-width:0}
    .reward-item-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .reward-item-title{min-width:0;font-size:13px;font-weight:700;line-height:1.25}
    .reward-status{flex:0 0 auto;border-radius:999px;background:#21262d;color:var(--muted);padding:3px 6px;font-size:9px;font-weight:700;line-height:1.2;text-transform:uppercase;white-space:nowrap}
    .reward-item.eligible .reward-status{background:rgba(46,160,67,.16);color:#7ee787}
    .reward-item.unknown .reward-status{background:rgba(210,153,34,.14);color:#f2cc60}
    .reward-item-meta{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.35}
    .reward-empty{padding:24px 16px;color:var(--muted);font-size:12px;line-height:1.5}
    .reward-empty strong{display:block;margin-bottom:5px;color:var(--text);font-size:14px}
    .reward-note{padding:11px 16px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:11px;line-height:1.45}
    .section-title-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:24px 0 14px}
    .section-title{margin:0;font-size:24px}
    .history-shell{margin-top:24px}
    .history-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
    .history-tab{appearance:none;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
    .history-tab:hover,.history-tab.active{border-color:var(--link);color:var(--link);background:#1f2630}
    .history-control-row{display:flex;justify-content:flex-end;margin:0 0 14px}
    .history-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;align-items:stretch;border:1px solid var(--border);border-radius:10px;background:var(--panel);overflow:hidden}
    .history-column{padding:12px;min-width:0}
    .history-column+.history-column{border-left:1px solid var(--border)}
    .history-column-title{margin:0;padding:0 0 11px;text-align:center;font-size:18px;border-bottom:1px solid var(--border)}
    .history-lines{display:grid}
    .history-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:10px 0;border-top:1px solid rgba(139,148,158,.22)}
    .history-line:first-child{border-top:0}
    .history-line-main{min-width:0}
    .history-line-title{font-weight:700;text-align:left;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .history-line-date{text-align:left;color:var(--muted);font-size:10px;line-height:1.25;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .history-line-data{display:grid;flex:0 0 auto;align-items:center;justify-content:end;gap:0;min-width:0}
    .history-line-data-clan{grid-template-columns:48px 54px 92px 58px}
    .history-line-data-league{grid-template-columns:52px 40px 42px 58px}
    .history-line-data-leaderboard{grid-template-columns:104px 58px}
    .history-line-chip{min-width:0;padding:0 4px;text-align:center;border-left:1px solid rgba(139,148,158,.28)}
    .history-line-chip:first-child{border-left:0}
    .history-line-chip .label{display:block;margin:0 0 1px;color:var(--muted);font-size:9px;line-height:1.1;white-space:nowrap}
    .history-line-value{display:block;font-size:12px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
    .history-empty{border:1px dashed var(--border);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
    .summary-list{display:grid;grid-template-columns:1fr;gap:12px}
    .summary-card{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:16px}
    .summary-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}
    .summary-title{margin:0 0 5px;font-size:20px}
    .summary-meta{text-align:right;color:var(--muted);font-size:13px;line-height:1.45}
    .summary-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 18px}
    .summary-stat{min-width:0}
    .summary-stat .value{font-size:18px;font-weight:700;overflow-wrap:anywhere}
    select{min-width:230px;padding:9px 11px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text)}
    .battle-card{overflow:hidden}
    .battle-head{padding:16px;border-bottom:1px solid var(--border)}
    .battle-title{margin:0 0 10px}
    .stats{padding:8px 16px 16px}
    .stat-row{display:grid;grid-template-columns:minmax(190px,1fr) minmax(100px,1fr);gap:16px;padding:8px;border-bottom:1px solid var(--border)}
    .stat-row:last-child{border-bottom:0}
    .stat-value{text-align:right;font-variant-numeric:tabular-nums}
    .chart-wrap{position:relative;padding:0 16px 16px}
    .controls{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 10px;color:var(--muted);font-size:13px}
    .controls label{display:inline-flex;gap:6px;align-items:center}
    .chart{width:100%;height:280px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);cursor:crosshair}
    .tip{position:absolute;display:none;pointer-events:none;z-index:5;min-width:220px;max-width:320px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#0b0f14;box-shadow:0 8px 24px #0008;font-size:13px;line-height:1.45}
    .empty,.error{padding:18px;color:var(--muted)}
    .error{border-color:#f85149;background:rgba(248,81,73,.12);color:#ffb4ad}
    .modal-backdrop{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(1,4,9,.72)}
    .modal{width:min(560px,100%);border:1px solid var(--border);border-radius:10px;background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.5);padding:18px}
    .modal h2{margin:0 0 8px;font-size:22px}
    .modal p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.45}
    .modal label{display:block;margin:0 0 7px;color:var(--muted);font-size:13px}
    .modal input{width:100%;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);padding:10px 11px;font:inherit}
    .modal input:focus{outline:none;border-color:var(--link);background:#1f2630}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
    .modal-status{min-height:20px;margin-top:10px;color:var(--muted);font-size:13px;line-height:1.45}
    .modal-status.error-text{color:#ffb4ad}
    .modal-status.success-text{color:#7ee787}
    @media(max-width:1000px){
      .battle-detail-grid{grid-template-columns:1fr}
      .history-grid{grid-template-columns:1fr}
      .history-column+.history-column{border-left:0;border-top:1px solid var(--border)}
    }
    @media(max-width:700px){
      main{padding:16px}
      .menu-bar{justify-content:flex-start}
      .cards{grid-template-columns:1fr}
      .history-control-row{justify-content:stretch}
      .summary-head{display:block}
      .summary-meta{text-align:left;margin-top:6px}
      .summary-stats{grid-template-columns:1fr}
      .stat-row{grid-template-columns:1fr}
      .stat-value{text-align:left}
      .chart{height:230px}
      select{width:100%;min-width:0}
    }
    @media(max-width:520px){
      .history-line{grid-template-columns:1fr;gap:7px}
      .history-line-data{width:100%;justify-content:stretch}
      .history-line-data-clan{grid-template-columns:repeat(4,minmax(0,1fr))}
      .history-line-data-league{grid-template-columns:repeat(4,minmax(0,1fr))}
      .history-line-data-leaderboard{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
  .lookup-menu{position:relative;display:inline-block}
.lookup-menu>summary{list-style:none;cursor:pointer}
.lookup-menu>summary::-webkit-details-marker{display:none}
.menu .lookup-summary,.menu-bar .lookup-summary{display:inline-block;padding:7px 12px;border:1px solid var(--border,#30363d);border-radius:5px;background:var(--panel-2,#0f141b);color:var(--text,#e6edf3);font-size:13px;line-height:1}
.menu .lookup-summary.active,.menu-bar .lookup-summary.active{border-color:var(--link,#ff9b96);color:var(--link,#ff9b96);background:rgba(248,81,73,.12)}
.lookup-menu-list{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:50;min-width:165px;padding:6px;border:1px solid var(--border,#30363d);border-radius:8px;background:var(--panel,#161b22);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.lookup-menu[open] .lookup-menu-list{display:flex;flex-direction:column;gap:4px}
.lookup-menu-list a{display:block;white-space:nowrap;text-align:left}
</style>
</head>

<script src="assets/ps99-version-chart-markers.js"></script>
<script>
const CLANS={
  c0ld:{key:"c0ld",label:"c0ld",mascot:"assets/c0ld-kitsune-logo.gif",switchTarget:"WMSY",color:"#ff9b96"},
  wmsy:{key:"wmsy",label:"WMSY",mascot:"assets/mascots/wmsy-frog.png",switchTarget:"c0ld",color:"#74d99f"}
};

const MEMBER_CURRENT="https://c0ld-clan-api-worker.opal-dde.workers.dev/api/current";
const MEMBER_HISTORY="https://c0ld-clan-api-worker.opal-dde.workers.dev/api/history";
const MEMBER_BATTLES="https://c0ld-clan-api-worker.opal-dde.workers.dev/api/battles";
const GLOBAL_SEARCH="https://c0ld-clan-api-worker.opal-dde.workers.dev/api/global/search";
const EXTERNAL_HISTORY="https://c0ld-clan-api-worker.opal-dde.workers.dev/api/external-history";
const CW_BOT_IMPORT="https://c0ld-clan-api-worker.opal-dde.workers.dev/api/external-history/cwbot/import";
const BIG_BOT_IMPORT="https://c0ld-clan-api-worker.opal-dde.workers.dev/api/external-history/bigbot/import";
const CLANS_CURRENT="https://c0ld-clan-api-worker.opal-dde.workers.dev/api/clans/current";
const LEAGUE_PROFILE="https://yamo-league-api-worker.opal-dde.workers.dev/api/leagues/profile";
const LEAGUE_PLAYER_POOL_NAME="GLOBAL_LEAGUE_PLAYER_POOL";
const ACTIVE_BATTLE="https://ps99.biggamesapi.io/api/activeClanBattle";
const REWARD_ITEM_CATALOG={
  "Gargantuan Storm Wolf":{name:"Gargantuan Storm Wolf",category:"Pet",icon_id:"94993144229478"},
  "Titanic Lunar Deer":{name:"Titanic Lunar Deer",category:"Pet",icon_id:"95100001711029",golden_icon_id:"104177631778430"},
  "Huge Lunar Fox":{name:"Huge Lunar Fox",category:"Pet",icon_id:"124053652407994"},
  "Clan Gift 2":{name:"Clan Gift #2",category:"Gift",icon_id:"126839917322650"}
};
const REWARD_RULE_OVERRIDES={
  "lunarbattle2026|lunar|1|30":{name:"Lunar Hoverboard",category:"Hoverboard",icon_id:"135130713894669"},
  "lunarbattle2026|lunar|1|50":{name:"Lunar Booth",category:"Booth",icon_id:"79728819130337"}
};
const EMBEDDED_HISTORY_BATTLE_LIMIT=24;
const FULL_HISTORY_BATTLE_LIMIT=60;
const HISTORY_FETCH_CONCURRENCY=5;

const DEFAULT_AVATAR="data:image/svg+xml;utf8,"+encodeURIComponent(`
  <svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
    <rect width="150" height="150" rx="16" fill="#21262d"/>
    <circle cx="75" cy="58" r="26" fill="#6e7681"/>
    <path d="M36 123c8-20 24-32 39-32s31 12 39 32" fill="#6e7681"/>
  </svg>
`);

let activeInfo=null;
let activeInfoLoaded=false;
let profile=null;
let battleIndex=0;
let activeHistoryTab="clan";
let showPoints=true;
let showRank=true;
let chartCache=null;

function normalize(value){return String(value||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"")}
function normalizeProfile(value){return String(value||"").trim().toLowerCase().replace(/\s+/g,"").replace(/[^a-z0-9_]/g,"")}
function clan(){const p=new URLSearchParams(location.search);let key=p.get("clan");if(!key){try{key=localStorage.getItem("c0ld:site-clan-mode")}catch{key=""}}return CLANS[normalize(key)]||CLANS.c0ld}
function profileId(){return new URLSearchParams(location.search).get("id")||""}
function isEmbedded(){return new URLSearchParams(location.search).get("embed")==="1"}
function prettifyBattleName(value){return String(value||"").trim().replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/(\D)(20\d{2})$/i,"$1 $2").replace(/\s+/g," ").trim()}
function isLegacyNongBattle(battle){const keys=[battle?.battle,battle?.battle_key,battle?.api_battle_key,battle?.display_name,battle?.battle_display_name,battle?.source_table,battle?.c0ld_results_table,battle?.clan_results_table].map(normalize),isApiSource=String(battle?.source||"").toLowerCase()==="api",isAlwaysLegacy=keys.some(key=>key==="safetybattle"||key==="poisonbattle"||key==="poisonturtlebattle"||key==="abstractbattle"||key==="abstractc0ld"||key==="spring2026"),isStaticOnlyLegacy=!isApiSource&&keys.some(key=>key==="angelbattle2026"||key==="angelbattle2026c0ld"||key==="angelbattle2026clans"||key==="starrybattle"||key==="starryc0ld"||key==="starryclans");return isAlwaysLegacy||isStaticOnlyLegacy}
function battleName(battle){const key=String(battle?.battle||battle?.battle_key||battle?.api_battle_key||"").trim(),raw=String(battle?.display_name||battle?.battle_display_name||"").trim(),pretty=prettifyBattleName(key);if(key&&raw&&normalize(raw).includes("backrooms")&&!normalize(key).includes("backrooms"))return stripClanPrefix(pretty||key,battle);return stripClanPrefix(raw||pretty||key,battle)}

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function finite(value){
  if(value===null||value===undefined||value==="")return null;
  const n=Number(value);
  return Number.isFinite(n)?n:null;
}

function fmt(value){
  const n=finite(value);
  return n===null?"—":n.toLocaleString("en-US");
}

function fmtShort(value){
  const n=finite(value);
  if(n===null)return"—";
  for(const tier of[{v:1e12,s:"T"},{v:1e9,s:"B"},{v:1e6,s:"M"},{v:1e3,s:"K"}]){
    if(Math.abs(n)>=tier.v)return(n/tier.v).toFixed(1).replace(/\.0$/,"")+tier.s;
  }
  return String(Math.round(n));
}

function fmtDate(value){
  if(!value)return"—";
  const d=new Date(value);
  return Number.isNaN(d.getTime())?"—":d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}

function fmtDateTime(value){
  if(!value)return"—";
  const d=new Date(value);
  return Number.isNaN(d.getTime())?"—":d.toLocaleString(undefined,{dateStyle:"short",timeStyle:"medium"});
}

function ordinalDay(day){
  const mod100=day%100;
  if(mod100>=11&&mod100<=13)return`${day}th`;
  const suffix={1:"st",2:"nd",3:"rd"}[day%10]||"th";
  return`${day}${suffix}`;
}

function fmtJoinedDate(value){
  if(!value)return"—";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return"—";

  const month=d.toLocaleString(undefined,{month:"long"});
  const year=d.getFullYear();
  const time=d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  return`${month} ${ordinalDay(d.getDate())}, ${year}, ${time}`;
}

function formatPercent(value){
  return Number.isFinite(value)?`${value.toFixed(1).replace(/\.0$/,"")}%`:"—";
}

function formatDuration(ms){
  if(!Number.isFinite(ms)||ms<0)return"—";

  let totalMinutes=Math.round(ms/60000);
  const days=Math.floor(totalMinutes/1440);
  totalMinutes-=days*1440;

  const hours=Math.floor(totalMinutes/60);
  totalMinutes-=hours*60;

  const minutes=totalMinutes;
  const parts=[];

  if(days)parts.push(`${days}d`);
  if(hours)parts.push(`${hours}h`);
  if(minutes||!parts.length)parts.push(`${minutes}m`);

  return parts.join(" ");
}

function rowPoints(row){return row?.total_points??row?.points??0}

async function fetchJson(url,label,{cacheBust=false,cache="default"}={}){
  const target=cacheBust?`${url}${url.includes("?")?"&":"?"}v=${Date.now()}`:url;
  const res=await fetch(target,{cache});
  if(!res.ok)throw new Error(`Could not load ${label}. HTTP ${res.status}`);
  return res.json();
}

async function optionalJson(url,options){
  try{return await fetchJson(url,url,options)}catch{return null}
}

async function mapLimit(items,limit,mapper){
  const list=Array.from(items||[]);
  const results=new Array(list.length);
  let next=0;

  const workers=Array.from({length:Math.min(Math.max(1,limit),list.length)},async()=>{
    while(next<list.length){
      const index=next++;
      results[index]=await mapper(list[index],index);
    }
  });

  await Promise.all(workers);
  return results;
}

function historyBattleLimit(){
  return isEmbedded()?EMBEDDED_HISTORY_BATTLE_LIMIT:FULL_HISTORY_BATTLE_LIMIT;
}

function setupChrome(){
  const currentClan=clan();
  const switchClan=CLANS[normalize(currentClan.switchTarget)]||CLANS.c0ld;

  if(isEmbedded())document.body.classList.add("embedded");

  document.documentElement.style.setProperty("--link",currentClan.color);

  const logo=document.getElementById("site-mascot");
  const logoLink=document.getElementById("clan-mascot-link");

  logo.src=currentClan.mascot;
  logo.alt=currentClan.label;
  logoLink.href=homeUrl(switchClan.label);

  document.querySelectorAll("[data-page]").forEach(link=>{
    const page=link.dataset.page;
    link.href=pageUrl(page);
    if(page==="index.html")link.textContent=`${currentClan.label} Leaderboard`;
  });
}

function notifyEmbedHeight(){
  if(!isEmbedded()||window.parent===window)return;

  requestAnimationFrame(()=>{
    window.parent.postMessage({
      type:"c0ld-profile-height",
      height:Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.offsetHeight
      )
    },"*");
  });
}

function pageUrl(page,params={}){
  const currentClan=clan();
  const url=new URL(page,location.href);
  url.search="";

  if(currentClan.key!=="c0ld")url.searchParams.set("clan",currentClan.label);

  for(const[key,value]of Object.entries(params)){
    if(value!==undefined&&value!==null&&value!=="")url.searchParams.set(key,value);
  }

  return`${url.pathname.split("/").pop()}${url.search}`;
}

function homeUrl(label){
  return normalize(label)==="c0ld"?"index.html":"index.html?clan="+encodeURIComponent(label);
}

function activeTitle(){
  return activeInfo?.data?.configData?.Title||activeInfo?.data?.configName||activeInfo?.data?._id||"";
}

function isoFromUnix(value){
  const n=Number(value);
  return Number.isFinite(n)&&n>0?new Date(n*1000).toISOString():null;
}

function june13StartFromEnd(endIso){
  const d=new Date(endIso);
  if(Number.isNaN(d.getTime()))return null;
  d.setUTCFullYear(2026,5,13);
  return d.toISOString();
}

function activeRange(){
  const config=activeInfo?.data?.configData||{};
  const end=isoFromUnix(config.FinishTime);
  const apiStart=isoFromUnix(config.StartTime);

  return{
    start:june13StartFromEnd(end)||apiStart,
    end
  };
}

function battleIdentity(battle){
  return normalize(stripClanPrefix(battle?.battle||battle?.display_name||battle?.api_battle_key||"",battle));
}

function isActiveBattle(battle){
  const active=normalize(activeTitle());
  const names=[battle?.battle,battle?.display_name,battle?.api_battle_key].map(normalize);
  return(active&&names.includes(active))||/backrooms/i.test(String(battle?.battle||battle?.display_name||""));
}

function eventRange(battle){
  if(isActiveBattle(battle)){
    const range=activeRange();
    if(range.start||range.end)return range;
  }

  return{
    start:battle?.battle_start_iso||battle?.battle_first_snapshot||battle?.first_snapshot||battle?.first_seen||null,
    end:battle?.battle_end_iso||battle?.battle_last_snapshot||battle?.last_snapshot||battle?.last_seen||null
  };
}

function findCurrentRow(current,id){
  const raw=String(id||"").trim();
  const key=normalizeProfile(raw);

  return(current.rows||[]).find(row=>
    String(row.user_id||"")===raw||
    normalizeProfile(row.profile_key)===key||
    normalizeProfile(row.username)===key
  )||null;
}

function normalizeSeries(series){
  return(series||[])
    .map(item=>({
      t:item.t||item.fetched_at||item.snapshot_at,
      rank:finite(item.rank),
      points:finite(item.points??item.total_points)
    }))
    .filter(item=>item.t&&(item.points!==null||item.rank!==null))
    .sort((a,b)=>new Date(a.t)-new Date(b.t));
}

function mergeSeries(a,b){
  const map=new Map();

  for(const point of[...normalizeSeries(a),...normalizeSeries(b)]){
    const time=new Date(point.t);
    if(Number.isNaN(time.getTime()))continue;

    const key=time.toISOString();
    map.set(key,{...(map.get(key)||{}),...point,t:key});
  }

  return[...map.values()].sort((x,y)=>new Date(x.t)-new Date(y.t));
}

function recalcBattle(battle){
  const series=normalizeSeries(battle.series);
  const ranks=series.map(p=>p.rank).filter(Number.isFinite);
  const points=series.map(p=>p.points).filter(Number.isFinite);
  const first=series[0]||{};
  const last=series[series.length-1]||{};

  return{
    ...battle,
    series,
    starting_rank:battle.starting_rank??first.rank??null,
    best_rank:ranks.length?Math.min(...ranks):battle.best_rank??null,
    worst_rank:ranks.length?Math.max(...ranks):battle.worst_rank??null,
    ending_rank:battle.ending_rank??battle.end_rank??battle.last_rank??last.rank??null,
    ending_points:battle.ending_points??last.points??(points.length?points[points.length-1]:null),
    battle_first_snapshot:battle.battle_first_snapshot||first.t||null,
    battle_last_snapshot:battle.battle_last_snapshot||last.t||null
  };
}

function summaryKey(row,type){
  const summaryType=type||row?.type||"";
  if(summaryType==="leaderboard"){
    return[
      summaryType,
      normalize(leaderboardHistoryLabel(row))
    ].join("|");
  }
  if(summaryType==="league"){
    return[
      summaryType,
      row?.league_period_key||row?.label_key||row?.league_run_key||"",
      row?.league_id||"",
      normalize(row?.league_name||"")
    ].join("|");
  }

  return[
    summaryType,
    row?.league_run_key||row?.run_key||"",
    row?.league_id||"",
    normalize(row?.league_name||row?.event_name||row?.battle_display_name||row?.label||""),
    row?.final_snapshot_at||""
  ].join("|");
}

function stripClanPrefix(label,row={}){
  let out=String(label||"").trim();
  const prefixes=[
    row.source_clan,
    row.clan_name,
    profile?.source_clan,
    profile?.clan_name,
    clan().label,
    "c0ld",
    "cold",
    "wmsy"
  ].map(value=>String(value||"").trim()).filter(Boolean);

  for(const prefix of prefixes){
    const escaped=prefix.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    out=out.replace(new RegExp(`^${escaped}\\s*[-:|]\\s*`,"i"),"").trim();
  }

  return out;
}

function stripLeaderboardClanPrefix(label,row={}){
  return stripClanPrefix(label,row);
}

function leaderboardHistoryLabel(row={},run={}){
  const candidates=[
    row.leaderboard_name,
    row.event_name,
    row.battle_display_name,
    row.label,
    run.leaderboard_name,
    run.event_name,
    run.battle_display_name,
    row.battle_key,
    "Global Leaderboard"
  ];

  for(const value of candidates){
    const cleaned=stripLeaderboardClanPrefix(value,row);
    if(cleaned)return cleaned;
  }

  return"Global Leaderboard";
}

function mergeSummaries(type,...lists){
  const map=new Map();

  for(const row of lists.flat().filter(Boolean)){
    const key=summaryKey(row,type);
    const existing=map.get(key);
    if(!existing||new Date(row.final_snapshot_at||0)>new Date(existing.final_snapshot_at||0)){
      map.set(key,{...existing,...row,type:row.type||type});
    }
  }

  return[...map.values()].sort((a,b)=>new Date(b.final_snapshot_at||0)-new Date(a.final_snapshot_at||0));
}

function summarizeLeaderboardRows(rawRows,fallbackRow={},run={}){
  const rows=Array.isArray(rawRows)?rawRows.slice():[];
  const currentRunKey=fallbackRow.run_key||run.run_key||null;
  const hasCurrent=currentRunKey&&rows.some(row=>String(row.run_key||"")===String(currentRunKey));

  if(!rows.length||!hasCurrent){
    rows.push({
      run_key:currentRunKey,
      fetched_at:fallbackRow.fetched_at||run.finished_at||run.updated_at||null,
      leaderboard_name:fallbackRow.leaderboard_name||run.leaderboard_name||null,
      event_name:fallbackRow.leaderboard_name||run.leaderboard_name||fallbackRow.event_name||run.event_name||null,
      battle_key:fallbackRow.battle_key||run.battle_key||null,
      battle_display_name:fallbackRow.battle_display_name||run.battle_display_name||null,
      source_clan:fallbackRow.source_clan||fallbackRow.clan_name||null,
      global_rank:fallbackRow.global_rank,
      global_points:fallbackRow.global_points,
      total_global_players:fallbackRow.total_global_players
    });
  }

  const groups=new Map();
  for(const row of rows){
    const rank=finite(row.global_rank);
    const points=finite(row.global_points??row.points);
    if(rank===null&&points===null)continue;

    const key=normalize(leaderboardHistoryLabel(row,run));
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(row);
  }

  return[...groups.values()].map(group=>{
    const ordered=group
      .slice()
      .sort((a,b)=>new Date(a.fetched_at||0)-new Date(b.fetched_at||0));
    const first=ordered[0]||{};
    const latest=ordered[ordered.length-1]||first;
    const ranks=ordered.map(row=>finite(row.global_rank)).filter(Number.isFinite);
    const points=ordered.map(row=>finite(row.global_points??row.points)).filter(Number.isFinite);
    const label=leaderboardHistoryLabel({...first,...latest},run);

    return{
      type:"leaderboard",
      run_key:latest.run_key||first.run_key||run.run_key||null,
      label,
      leaderboard_name:label,
      event_name:label,
      battle_key:latest.battle_key||first.battle_key||run.battle_key||null,
      battle_display_name:latest.battle_display_name||first.battle_display_name||run.battle_display_name||null,
      clan_name:latest.source_clan||latest.clan_name||first.source_clan||first.clan_name||fallbackRow.source_clan||fallbackRow.clan_name||null,
      source_clan:latest.source_clan||first.source_clan||fallbackRow.source_clan||fallbackRow.clan_name||null,
      final_rank:finite(latest.global_rank),
      best_rank:ranks.length?Math.min(...ranks):null,
      final_points:finite(latest.global_points??latest.points),
      highest_points:points.length?Math.max(...points):null,
      total_ranked:finite(latest.total_global_players??first.total_global_players??run.total_global_players??run.candidate_player_count),
      first_snapshot_at:first.fetched_at||null,
      final_snapshot_at:latest.fetched_at||run.finished_at||run.updated_at||null,
      snapshot_count:ordered.length
    };
  }).filter(row=>row.final_rank!==null||row.final_points!==null);
}

function downsampleSeriesByMinutes(series,minutes){
  const bucketMs=Math.max(1,minutes)*60*1000;
  const buckets=new Map();

  for(const point of normalizeSeries(series)){
    const time=new Date(point.t).getTime();
    if(Number.isNaN(time))continue;

    const key=Math.floor(time/bucketMs)*bucketMs;
    const previous=buckets.get(key);

    if(!previous||new Date(point.t)>new Date(previous.t)){
      buckets.set(key,point);
    }
  }

  return[...buckets.values()].sort((a,b)=>new Date(a.t)-new Date(b.t));
}

async function loadLiveProfile(id){
  const current=await fetchJson(`${MEMBER_CURRENT}?clan=${encodeURIComponent(clan().label)}`,"live leaderboard");
  const currentRow=findCurrentRow(current,id);
  const userId=currentRow?.user_id||(/^\d+$/.test(String(id))?String(id):"");

  if(!userId&&!currentRow)return null;
  if(!currentRow&&isEmbedded())return null;

  const battleListData=await optionalJson(`${MEMBER_BATTLES}?clan=${encodeURIComponent(clan().label)}&limit=${historyBattleLimit()}`)||{rows:[]};
  const battleMap=new Map();

  for(const item of[
    {
      battle:current.battle||"current",
      display_name:battleName(current)||"Current Clan Battle",
      battle_start_iso:current.battle_start_iso,
      battle_end_iso:current.battle_end_iso,
      last_snapshot:current.snapshot_at||current.generated_at
    },
    ...(Array.isArray(battleListData.rows)?battleListData.rows:[])
  ]){
    if(isLegacyNongBattle(item))continue;
    const key=battleIdentity(item)||`battle-${battleMap.size}`;
    if(!battleMap.has(key))battleMap.set(key,item);
  }

  const battles=[];
  let username=currentRow?.username||String(id);
  let latestPoints=currentRow?rowPoints(currentRow):null;
  let latestRank=currentRow?.rank??null;
  let latestSeen=currentRow?.fetched_at||current.snapshot_at||current.generated_at||null;
  let joinedAt=currentRow?.join_time||currentRow?.joined_at||null;
  const battleHistories=await mapLimit([...battleMap.values()].slice(0,historyBattleLimit()),HISTORY_FETCH_CONCURRENCY,async battleMeta=>{
    const battleKey=battleMeta.battle||battleMeta.battle_key||current.battle||"";
    let history={rows:[]};

    const historyUrl=
      `${MEMBER_HISTORY}?clan=${encodeURIComponent(clan().label)}`+
      `&user_id=${encodeURIComponent(userId)}`+
      `${battleKey?`&battle=${encodeURIComponent(battleKey)}`:""}`+
      `&hours=10000&limit=50000`;

    history=await optionalJson(historyUrl)||{rows:[]};

    return{
      battleMeta,
      battleKey,
      rows:Array.isArray(history.rows)?history.rows.slice():[],
      isCurrentBattle:normalize(battleKey)===normalize(current.battle||"current")
    };
  });

  for(const item of battleHistories){
    if(!item)continue;

    const{battleMeta,battleKey,isCurrentBattle}=item;
    const rows=item.rows;

    if(currentRow&&isCurrentBattle){
      const currentTime=currentRow.fetched_at||current.snapshot_at||current.generated_at;

      if(currentTime&&!rows.some(row=>new Date(row.fetched_at||0).getTime()===new Date(currentTime).getTime())){
        rows.push({
          fetched_at:currentTime,
          rank:currentRow.rank,
          username:currentRow.username,
          user_id:currentRow.user_id,
          total_points:rowPoints(currentRow)
        });
      }
    }

    if(!rows.length)continue;

    rows.sort((a,b)=>new Date(a.fetched_at||0)-new Date(b.fetched_at||0));

    const first=rows[0]||{};
    const last=rows[rows.length-1]||{};
    const ranks=rows.map(row=>finite(row.rank)).filter(Number.isFinite);

    if(isCurrentBattle||!latestSeen||new Date(last.fetched_at||0)>new Date(latestSeen||0)){
      username=currentRow?.username||last.username||first.username||username;
      latestPoints=isCurrentBattle&&currentRow?rowPoints(currentRow):rowPoints(last);
      latestRank=isCurrentBattle&&currentRow?currentRow.rank:last.rank??latestRank;
      latestSeen=(isCurrentBattle&&currentRow?currentRow.fetched_at:null)||last.fetched_at||latestSeen;
      joinedAt=(isCurrentBattle&&currentRow?(currentRow.join_time||currentRow.joined_at):null)||joinedAt;
    }

    battles.push(recalcBattle({
      battle:battleKey||"current",
      source:battleMeta.source||"api",
      display_name:battleName(battleMeta)||battleKey||"Current Clan Battle",
      battle_first_snapshot:battleMeta.battle_start_iso||battleMeta.first_snapshot||first.fetched_at||null,
      battle_last_snapshot:battleMeta.last_snapshot||last.fetched_at||null,
      first_seen:first.fetched_at||null,
      last_seen:last.fetched_at||null,
      starting_rank:first.rank??null,
      worst_rank:ranks.length?Math.max(...ranks):null,
      best_rank:ranks.length?Math.min(...ranks):null,
      ending_rank:(isCurrentBattle&&currentRow?currentRow.rank:null)??last.rank??null,
      ending_points:(isCurrentBattle&&currentRow?rowPoints(currentRow):null)??rowPoints(last),
      series:rows.map(row=>({
        t:row.fetched_at,
        rank:row.rank??null,
        points:Number(rowPoints(row)||0)
      })).filter(point=>point.t)
    }));
  }

  if(!battles.length)return null;

  return{
    aliases:[String(id)],
    username,
    user_id:userId||currentRow?.user_id||null,
    avatar_url:currentRow?.avatar_url||null,
    profile_url:(userId||currentRow?.user_id)?`https://www.roblox.com/users/${userId||currentRow.user_id}/profile`:null,
    total_battles:battles.length,
    latest_rank:latestRank,
    latest_points:latestPoints,
    latest_seen:latestSeen,
    joined_at:joinedAt,
    source_clan:clan().label,
    clan_name:clan().label,
    clan_rank:latestRank,
    clan_points:latestPoints,
    member_rank:latestRank,
    member_points:latestPoints,
    battles
  };
}

async function loadGlobalProfile(id){
  const payload=await optionalJson(`${GLOBAL_SEARCH}?clan=c0ld&q=${encodeURIComponent(id)}`);
  const row=payload?.row;

  if(!payload?.ok||!row)return null;

  const seen=row.fetched_at||row.updated_at||payload.run?.finished_at||payload.run?.updated_at||null;
  const globalPoints=finite(row.global_points);
  const memberPoints=finite(row.member_points??row.clan_points??row.global_points);
  const clanPoints=memberPoints;
  const points=globalPoints??clanPoints??0;
  const globalRank=finite(row.global_rank);
  const memberRank=finite(row.member_rank??row.clan_rank);
  const clanRank=memberRank;
  const rawHistory=Array.isArray(payload.history)?payload.history:[];
  const clanSeries=mergeSeries([],rawHistory.map(item=>({
    t:item.fetched_at,
    rank:finite(item.member_rank??item.clan_rank),
    points:finite(item.member_points??item.clan_points??item.global_points??item.points)
  })));
  const globalSeries=mergeSeries([],rawHistory.map(item=>({
    t:item.fetched_at,
    rank:finite(item.global_rank),
    points:finite(item.global_points??item.points??item.clan_points)
  })));
  const currentTime=seen;

  if(currentTime&&!clanSeries.some(item=>new Date(item.t).getTime()===new Date(currentTime).getTime())){
    clanSeries.push({
      t:currentTime,
      rank:clanRank,
      points:clanPoints
    });
    clanSeries.sort((a,b)=>new Date(a.t)-new Date(b.t));
  }

  if(currentTime&&!globalSeries.some(item=>new Date(item.t).getTime()===new Date(currentTime).getTime())){
    globalSeries.push({
      t:currentTime,
      rank:globalRank,
      points
    });
    globalSeries.sort((a,b)=>new Date(a.t)-new Date(b.t));
  }

  const battleDisplayName=
    row.battle_display_name||
    row.event_name||
    payload.run?.battle_display_name||
    payload.run?.event_name||
    row.battle_key||
    payload.run?.battle_key||
    "Clan Battle";
  const sourceClan=row.source_clan||row.clan_name||"Clan";

async function loadLeagueProfile(userId){

  const fallbackLeaderboardRows=rawRows.filter(row=>normalize(row.league_name)===normalize(LEAGUE_PLAYER_POOL_NAME));
  const rows=normalizeLeagueSummaryRows(
    rawRows.filter(row=>normalize(row.league_name)!==normalize(LEAGUE_PLAYER_POOL_NAME))

function applyCurrentClanLeaderboardRank(target,clansCurrent){

  const currentKey=normalize(currentClan);

  const row=(clansCurrent.rows||[]).find(item=>normalize(item.clan_name)===currentKey)||null;
  const isTrackedClan=normalize(clansCurrent.clan_name)===currentKey;
  const rank=finite(row?.rank??(isTrackedClan?clansCurrent.clan_rank:null));
  const points=finite(row?.points??(isTrackedClan?clansCurrent.clan_points:null));

function mergeProfiles(staticProfile,liveProfile){
  staticProfile=filterProfileBattles(staticProfile);
  liveProfile=filterProfileBattles(liveProfile);

  if(!staticProfile)return liveProfile;
  if(!liveProfile)return staticProfile;

  const battleMap=new Map();

  for(const source of[staticProfile,liveProfile]){
    for(const battle of source.battles||[]){
      if(isLegacyNongBattle(battle))continue;
      const key=battleIdentity(battle)||`battle-${battleMap.size}`;
      const existing=battleMap.get(key);

      battleMap.set(
        key,
        existing
          ? recalcBattle({...existing,...battle,series:mergeSeries(existing.series,battle.series)})
          : recalcBattle(battle)
      );
    }
  }

  const battles=[...battleMap.values()];

  return{
    ...staticProfile,
    ...liveProfile,
    username:liveProfile.username||staticProfile.username||"Unknown",
    user_id:liveProfile.user_id||staticProfile.user_id||null,
    avatar_url:liveProfile.avatar_url||staticProfile.avatar_url||null,
    profile_url:liveProfile.profile_url||staticProfile.profile_url||null,
    total_battles:battles.length,
    latest_rank:liveProfile.latest_rank??staticProfile.latest_rank??null,
    latest_points:liveProfile.latest_points??staticProfile.latest_points??null,
    latest_seen:liveProfile.latest_seen??staticProfile.latest_seen??null,
    joined_at:liveProfile.joined_at??staticProfile.joined_at??null,
    source_clan:liveProfile.source_clan??staticProfile.source_clan??null,
    clan_name:liveProfile.clan_name??staticProfile.clan_name??null,
    clan_rank:liveProfile.clan_rank??staticProfile.clan_rank??null,
    clan_points:liveProfile.clan_points??staticProfile.clan_points??null,
    member_rank:liveProfile.member_rank??staticProfile.member_rank??liveProfile.latest_rank??staticProfile.latest_rank??null,
    member_points:liveProfile.member_points??staticProfile.member_points??liveProfile.latest_points??staticProfile.latest_points??null,
    source_clan_rank:liveProfile.source_clan_rank??staticProfile.source_clan_rank??null,
    source_clan_points:liveProfile.source_clan_points??staticProfile.source_clan_points??null,
    global_rank:liveProfile.global_rank??staticProfile.global_rank??null,
    global_points:liveProfile.global_points??staticProfile.global_points??null,
    total_global_players:liveProfile.total_global_players??staticProfile.total_global_players??null,
    is_global_profile:Boolean(liveProfile.is_global_profile||staticProfile.is_global_profile),
    battle_key:liveProfile.battle_key??staticProfile.battle_key??null,

  };

function clanHistoryBattles(){

    map.set(
      key,
      existing
        ? recalcBattle({...existing,...battle,display_name:battleName(battle)||battleName(existing),series:mergeSeries(existing.series,battle.series)})
        : recalcBattle({...battle,display_name:battleName(battle)})
    );

function clanPlacementKey(row){
  return normalize(stripClanPrefix(row?.battle||row?.battle_key||row?.label||row?.battle_name||row?.battle_display_name||"",row));
}

function isImportedClanPlacement(row){
  const source=String(row?.source||"").toLowerCase();
  return Boolean(row?.imported_from)||source==="cw_bot"||source==="big_bot";
}

function clanPlacementPriority(row){
  if(!isImportedClanPlacement(row))return 3;
  if(String(row?.source||"").toLowerCase()==="big_bot")return 2;
  return 1;
}

function mergeClanPlacementRows(...lists){
  const map=new Map();

  for(const row of lists.flat().filter(Boolean)){
    const key=clanPlacementKey(row)||`row-${map.size}`;
    const existing=map.get(key);

    if(!existing){
      map.set(key,row);
      continue;
    }

    const rowWins=clanPlacementPriority(row)>clanPlacementPriority(existing);
    const primary=rowWins?row:existing;
    const secondary=rowWins?existing:row;
    map.set(key,{
      ...secondary,
      ...primary,
      final_rank:finite(primary.final_rank)??finite(secondary.final_rank),
      total_ranked:finite(primary.total_ranked)??finite(secondary.total_ranked),
      global_rank:finite(primary.global_rank)??finite(secondary.global_rank),
      total_global_players:finite(primary.total_global_players)??finite(secondary.total_global_players),
      final_points:finite(primary.final_points)??finite(secondary.final_points)
    });
  }

  return[...map.values()];
}

function placementMatchKeys(row){
  const ignored=new Set(["clanbattle","globalleaderboard","leaderboard"]);
  return new Set([
    row?.battle,
    row?.battle_key,
    row?.label,
    row?.battle_display_name,
    row?.event_name,
    row?.leaderboard_name
  ].map(value=>normalize(stripClanPrefix(value,row))).filter(key=>key&&!ignored.has(key)));
}

function placementDayKeys(row){
  return new Set([
    row?.period_start_at,
    row?.period_end_at,
    row?.battle_start_iso,
    row?.battle_end_iso,
    row?.first_snapshot_at,
    row?.final_snapshot_at
  ].map(value=>{
    const date=new Date(value||0);
    return Number.isNaN(date.getTime())?"":date.toISOString().slice(0,10);
  }).filter(Boolean));
}

function matchingLeaderboardSummary(row,leaderboards){
  const rowKeys=placementMatchKeys(row);
  const nameMatch=(leaderboards||[]).find(candidate=>
    [...placementMatchKeys(candidate)].some(key=>rowKeys.has(key))
  );
  if(nameMatch)return nameMatch;

  // Imported rows use the Discord message timestamp, not the historical battle date.
  if(isImportedClanPlacement(row))return null;

  const rowDays=placementDayKeys(row);
  return(leaderboards||[]).find(candidate=>
    [...placementDayKeys(candidate)].some(day=>rowDays.has(day))
  )||null;
}

function clanPlacementSummaries(){

      snapshot_count:Array.isArray(row.series)?row.series.length:null
    };

function chartPoints(series){
  return normalizeSeries(series)
    .map(item=>({
      t:new Date(item.t).getTime(),
      rawT:item.t,
      points:item.points,
      rank:item.rank
    }))
    .filter(item=>!Number.isNaN(item.t));
}

function rawTrackedPoints(battle){
  return chartPoints(battle.series)
    .filter(point=>point.points!==null)
    .sort((a,b)=>a.t-b.t);
}

function stripSyntheticStart(points,battle){
  if(points.length<2)return points;

  const range=eventRange(battle);
  const eventStartMs=range.start?new Date(range.start).getTime():null;

  if(!Number.isFinite(eventStartMs))return points;

  const first=points[0];
  const second=points[1];
  const gap=second.t-first.t;
  const nearEventStart=Math.abs(first.t-eventStartMs)<120000;
  const hugeGap=gap>60*60*1000;

  if(nearEventStart&&hugeGap&&first.points===0){
    return points.slice(1);
  }

  return points;
}

function trackedPoints(battle){
  return stripSyntheticStart(rawTrackedPoints(battle),battle);
}

function trackedChartPoints(battle){
  const tracked=trackedPoints(battle);
  if(!tracked.length)return chartPoints(battle.series);

  const start=tracked[0].t;
  const end=tracked[tracked.length-1].t;

  return chartPoints(battle.series)
    .filter(point=>point.t>=start&&point.t<=end)
    .sort((a,b)=>a.t-b.t);
}

function isDowntimeSegment(current,next){
  const currentPoints=finite(current?.points);
  const nextPoints=finite(next?.points);

  if(currentPoints===null||nextPoints===null)return false;

  if(currentPoints===0)return true;

  return nextPoints<=currentPoints;
}

function segmentStatus(current,next){
  if(!next)return current?.points===0?"0 points":"Scoring";

  if(current?.points===0)return"0 points";

  return isDowntimeSegment(current,next)?"No point gain":"Scoring";
}

function activitySummary(battle){
  const points=trackedPoints(battle);

  if(points.length<2)return null;

  const trackedStart=points[0].t;
  const trackedEnd=points[points.length-1].t;
  const trackedMs=Math.max(0,trackedEnd-trackedStart);

  if(!trackedMs)return null;

  let downtime=0;

  for(let i=0;i<points.length-1;i++){
    const segment=Math.max(0,points[i+1].t-points[i].t);

    if(isDowntimeSegment(points[i],points[i+1])){
      downtime+=segment;
    }
  }

  const uptime=Math.max(0,trackedMs-downtime);

  return{
    total:trackedMs,
    downtime,
    uptime,
    downtimePct:trackedMs?(downtime/trackedMs)*100:0,
    uptimePct:trackedMs?(uptime/trackedMs)*100:0
  };
}

function rewardRowsForBattle(battle){
  const candidates=[
    battle?.placement_rewards,
    battle?.PlacementRewards,
    battle?.rewards?.PlacementRewards,
    battle?.configData?.PlacementRewards
  ];
  const direct=candidates.find(Array.isArray);
  if(direct)return direct;

  if(!isActiveBattle(battle))return[];
  const activeRewards=activeInfo?.data?.configData?.PlacementRewards;
  return Array.isArray(activeRewards)?activeRewards:[];
}

function rewardRuleNumber(rule,...keys){
  for(const key of keys){
    const value=finite(rule?.[key]);
    if(value!==null)return value;
  }
  return null;
}

function rewardRawId(rule){
  return String(
    rule?.Item?._data?.id??
    rule?.item?._data?.id??
    rule?.item_id??
    rule?.id??
    "Reward"
  ).trim()||"Reward";
}

function rewardCatalogEntry(id){
  return Object.entries(REWARD_ITEM_CATALOG)
    .find(([key])=>normalize(key)===normalize(id))?.[1]||null;
}

function inferredRewardCategory(id,rule){
  const explicit=String(
    rule?.category??
    rule?.Item?.category??
    rule?.Item?._class??
    rule?.Item?.ClassName??
    ""
  ).trim();
  if(explicit)return explicit.replace(/s$/i,"");
  if(/gargantuan|titanic|huge|pet/i.test(id))return"Pet";
  if(/hoverboard/i.test(id))return"Hoverboard";
  if(/booth/i.test(id))return"Booth";
  if(/gift|lootbox/i.test(id))return"Gift";
  if(/bag/i.test(id))return"Bag";
  return"Reward";
}

function rewardImageUrl(value){
  const raw=String(value||"").trim();
  if(!raw)return"";
  if(/^https?:\/\//i.test(raw)||raw.startsWith("data:"))return raw;
  const match=raw.match(/(?:rbxassetid:\/\/)?(\d+)/i);
  return match?`https://ps99.biggamesapi.io/image/${encodeURIComponent(match[1])}`:"";
}

function rewardItemDetails(rule,battle){
  const id=rewardRawId(rule);
  const best=rewardRuleNumber(rule,"Best","best","best_rank");
  const worst=rewardRuleNumber(rule,"Worst","worst","worst_rank");
  const battleKey=normalize(battle?.battle||battle?.display_name||(isActiveBattle(battle)?activeTitle():""));
  const override=REWARD_RULE_OVERRIDES[`${battleKey}|${normalize(id)}|${best??""}|${worst??""}`]||null;
  const catalog=rewardCatalogEntry(id);
  const base=override||catalog||{};
  const variant=rewardRuleNumber(rule?.Item?._data||rule?.item?._data||rule,"pt","pet_type");
  const variantPrefix=variant===2?"Rainbow ":variant===1?"Golden ":"";
  const rawName=String(base.name||rule?.display_name||id).trim();
  const name=variantPrefix&& !rawName.toLowerCase().startsWith(variantPrefix.toLowerCase())
    ?variantPrefix+rawName
    :rawName;
  const embeddedIcon=
    rule?.icon_url??
    rule?.Item?.icon_url??
    rule?.Item?._data?.icon??
    rule?.Item?._data?.thumbnail??
    "";
  const catalogIcon=variant===1&&base.golden_icon_id?base.golden_icon_id:base.icon_id;

  return{
    id,
    name,
    category:String(base.category||inferredRewardCategory(id,rule)),
    icon_url:rewardImageUrl(embeddedIcon||catalogIcon)
  };
}

function rewardRangeText(best,worst,label){
  if(best===null&&worst===null)return label;
  if(best!==null&&worst!==null&&best===worst)return`${label} #${fmt(best)}`;
  if(best===1&&worst!==null)return`${label} Top ${fmt(worst)}`;
  if(best!==null&&worst!==null)return`${label} #${fmt(best)}–${fmt(worst)}`;
  if(best!==null)return`${label} #${fmt(best)}+`;
  return`${label} through #${fmt(worst)}`;
}

function rewardRuleTarget(rule){
  const best=rewardRuleNumber(rule,"Best","best","best_rank");
  const worst=rewardRuleNumber(rule,"Worst","worst","worst_rank");
  const bestContributor=rewardRuleNumber(rule,"BestContributor","best_contributor");
  const worstContributor=rewardRuleNumber(rule,"WorstContributor","worst_contributor");
  const parts=[rewardRangeText(best,worst,"Clan")];
  if(bestContributor!==null||worstContributor!==null){
    parts.push(rewardRangeText(bestContributor,worstContributor,"Contributors"));
  }else{
    parts.push("All clan members");
  }
  return parts.join(" · ");
}

function rewardRankContext(battle){
  const active=isActiveBattle(battle);
  const clanRank=finite(
    battle?.source_clan_leaderboard_rank??
    battle?.clan_leaderboard_rank??
    battle?.clan_final_rank??
    (active?(profile.source_clan_leaderboard_rank??profile.source_clan_rank):null)
  );
  const contributorRank=finite(
    battle?.ending_rank??
    battle?.end_rank??
    battle?.last_rank??
    (active?(profile.member_rank??profile.clan_rank??profile.latest_rank):null)
  );
  return{clanRank,contributorRank};
}

function rewardRangeEligibility(rank,best,worst){
  if(best===null&&worst===null)return true;
  if(rank===null)return null;
  if(best!==null&&rank<best)return false;
  if(worst!==null&&rank>worst)return false;
  return true;
}

function rewardRuleEligibility(rule,ranks){
  const clanResult=rewardRangeEligibility(
    ranks.clanRank,
    rewardRuleNumber(rule,"Best","best","best_rank"),
    rewardRuleNumber(rule,"Worst","worst","worst_rank")
  );
  const contributorResult=rewardRangeEligibility(
    ranks.contributorRank,
    rewardRuleNumber(rule,"BestContributor","best_contributor"),
    rewardRuleNumber(rule,"WorstContributor","worst_contributor")
  );
  if(clanResult===false||contributorResult===false)return false;
  if(clanResult===null||contributorResult===null)return null;
  return true;
}

function rewardBattleFinished(battle){
  const end=eventRange(battle).end;
  const time=end?new Date(end).getTime():NaN;
  return Number.isFinite(time)&&time<=Date.now();
}

function renderRewardCard(battle){
  const rules=rewardRowsForBattle(battle);
  if(!rules.length){
    const loading=!activeInfoLoaded&&battleIndex===0;
    return`
      <aside class="reward-card" aria-label="Battle rewards">
        <div class="reward-card-head">
          <div>
            <div class="label">Selected Battle</div>
            <h3 class="reward-card-title">Reward Eligibility</h3>
          </div>
          <div class="reward-total">—</div>
        </div>
        <div class="reward-empty">
          <strong>${loading?"Loading reward details…":"Itemized rewards unavailable"}</strong>
          ${loading
            ?"Reading the current battle reward schedule from Big Games."
            :"The reward schedule was not captured for this archived battle. Eligibility is intentionally not estimated."}
        </div>
      </aside>
    `;
  }

  const ranks=rewardRankContext(battle);
  const finished=rewardBattleFinished(battle);
  const rows=rules.map(rule=>({
    rule,
    item:rewardItemDetails(rule,battle),
    eligible:rewardRuleEligibility(rule,ranks)
  }));
  const eligibleCount=rows.filter(row=>row.eligible===true).length;
  const unknownCount=rows.filter(row=>row.eligible===null).length;
  const totalLabel=unknownCount===rows.length?"Eligibility pending":`${eligibleCount} / ${rows.length} ${finished?"earned":"eligible"}`;
  const context=[
    ranks.clanRank!==null?`Clan placement #${fmt(ranks.clanRank)}`:"Clan placement unavailable",
    rows.some(row=>rewardRuleNumber(row.rule,"BestContributor","best_contributor")!==null||rewardRuleNumber(row.rule,"WorstContributor","worst_contributor")!==null)
      ?ranks.contributorRank!==null?`Contributor #${fmt(ranks.contributorRank)}`:"Contributor rank unavailable"
      :null
  ].filter(Boolean).join(" · ");

  return`
    <aside class="reward-card" aria-label="Battle rewards">
      <div class="reward-card-head">
        <div>
          <div class="label">Selected Battle</div>
          <h3 class="reward-card-title">Reward Eligibility</h3>
        </div>
        <div class="reward-total">${escapeHtml(totalLabel)}</div>
      </div>
      <div class="reward-rank-context">${escapeHtml(context)}</div>
      <div class="reward-items">
        ${rows.map(({rule,item,eligible})=>{
          const state=eligible===true?"eligible":eligible===null?"unknown":"";
          const status=eligible===true?(finished?"Earned":"Eligible now"):eligible===null?"Check ranks":"Not eligible";
          return`
            <article class="reward-item ${state}">
              ${item.icon_url?`<img class="reward-icon" src="${escapeHtml(item.icon_url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:`<span class="reward-icon" aria-hidden="true"></span>`}
              <div class="reward-item-copy">
                <div class="reward-item-title-row">
                  <div class="reward-item-title">${escapeHtml(item.name)}</div>
                  <span class="reward-status">${escapeHtml(status)}</span>
                </div>
                <div class="reward-item-meta">${escapeHtml(item.category)} · ${escapeHtml(rewardRuleTarget(rule))}</div>
              </div>
            </article>
          `;
        }).join("")}
      </div>
      <div class="reward-note">
        ${finished
          ?"Eligibility is calculated from the stored final placement available for this battle."
          :"Eligibility follows the current clan and contributor positions. Rewards are finalized when the battle closes."}
      </div>
    </aside>
  `;
}

  cw_bot:{
    label:"CW_Bot",
    endpoint:CW_BOT_IMPORT,

function setHistoryImportStatus(text,type=""){

}

function openHistoryImportModal(source="cw_bot"){
  if(!profile?.user_id)return;
  closeHistoryImportModal();
  activeHistoryImporter=HISTORY_IMPORTERS[source]?source:"cw_bot";
  const importer=HISTORY_IMPORTERS[activeHistoryImporter];

  modal.innerHTML=`

      <div id="history-import-status" class="modal-status"></div>
      <div class="modal-actions">

        <button class="profile-action" id="history-import-submit" type="button">Import Current Page</button>
      </div>
    </section>
  `;

async function refreshExternalHistory(){
  if(!profile?.user_id)return;
  const external=await loadExternalHistory(profile.user_id).catch(()=>null);
  profile={
    ...profile,
    external_clan_summaries:mergeClanPlacementRows(
      profile.external_clan_summaries||[],
      external?.external_clan_summaries||[]
    )
  };
}

async function submitHistoryImport(){
  const importer=HISTORY_IMPORTERS[activeHistoryImporter]||HISTORY_IMPORTERS.cw_bot;
  const input=document.getElementById("history-message-url");
  const button=document.getElementById("history-import-submit");
  const messageUrl=String(input?.value||"").trim();

  if(!messageUrl){
    setHistoryImportStatus("Paste a Discord message link first.","error-text");
    return;
  }

  button.disabled=true;
  setHistoryImportStatus(`Fetching ${importer.label} message and checking for duplicate battles...`);

  try{
    const res=await fetch(importer.endpoint,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        user_id:profile.user_id,
        username:profile.username,
        message_url:messageUrl
      })
    });
    const payload=await res.json().catch(()=>({}));
    if(!res.ok||payload.ok===false)throw new Error(payload.message||`Import failed with HTTP ${res.status}`);

    const importedCount=payload.imported_count||0;
    const backfilledCount=payload.backfilled_count||0;
    const statusText=payload.status==="approved"
      ? `${importedCount} new history row${importedCount===1?"":"s"} imported.`
      : `${importedCount} new history row${importedCount===1?"":"s"} saved as pending review.`;
    const backfilledText=backfilledCount?` ${backfilledCount} existing row${backfilledCount===1?"":"s"} backfilled.`:"";
    const skippedText=payload.skipped_count?` ${payload.skipped_count} complete/known row${payload.skipped_count===1?"":"s"} skipped.`:"";
    const hasMorePages=activeHistoryImporter==="big_bot"&&Number(payload.page)<Number(payload.pages);
    const pageText=activeHistoryImporter==="big_bot"&&payload.page&&payload.pages
      ? ` Page ${payload.page} of ${payload.pages} processed.`
      : "";
    const nextPageText=hasMorePages
      ? " Advance the Big Bot message to the next page in Discord, then click Import Current Page again using this same link."
      : "";

    await refreshExternalHistory();
    render();
    setHistoryImportStatus(statusText+backfilledText+skippedText+pageText+nextPageText,"success-text");

    if(hasMorePages){
      button.disabled=false;
    }else if(payload.status==="approved"&&(importedCount||backfilledCount)){
      setTimeout(closeHistoryImportModal,1200);
    }else{
      button.disabled=false;
    }
  }catch(error){
    setHistoryImportStatus(error.message||String(error),"error-text");
    button.disabled=false;
  }
}

function yScale(value,min,max,top,height,type){
  if(max===min)return top+height/2;
  const pct=(value-min)/(max-min);
  return type==="rank"?top+pct*height:top+(1-pct)*height;
}

function drawLine(ctx,points,x,y,color){
  if(!points.length)return;

  ctx.save();
  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.beginPath();

  points.forEach((point,index)=>{
    index?ctx.lineTo(x(point),y(point)):ctx.moveTo(x(point),y(point));
  });

  ctx.stroke();

  const last=points[points.length-1];
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x(last),y(last),3.5,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawActivityStrip(ctx,points,x,stripY){
  if(points.length<2)return;

  ctx.save();
  ctx.lineWidth=7;
  ctx.lineCap="round";

  for(let i=0;i<points.length-1;i++){
    ctx.strokeStyle=isDowntimeSegment(points[i],points[i+1])?"#f85149":"#3fb950";
    ctx.beginPath();
    ctx.moveTo(x(points[i]),stripY);
    ctx.lineTo(x(points[i+1]),stripY);
    ctx.stroke();
  }

  for(let i=0;i<points.length;i++){
    const next=points[i+1];
    const previous=points[i-1];
    const startsDowntime=next&&isDowntimeSegment(points[i],next);
    const endsDowntime=previous&&isDowntimeSegment(previous,points[i]);

    if(!startsDowntime&&!endsDowntime)continue;

    ctx.fillStyle="#f85149";
    ctx.beginPath();
    ctx.arc(x(points[i]),stripY,4,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

function drawChart(){
  const canvas=document.getElementById("chart");
  const tooltip=document.getElementById("tip");
  if(!canvas)return;

  const ctx=canvas.getContext("2d");
  const rect=canvas.getBoundingClientRect();
  const dpr=devicePixelRatio||1;
  const battle=clanHistoryBattles()[battleIndex];
  if(!battle)return;

  const all=trackedChartPoints(battle);
  const strip=trackedPoints(battle);
  const pointSeries=showPoints?all.filter(point=>point.points!==null):[];
  const rankSeries=showRank?all.filter(point=>point.rank!==null):[];
  const visible=[...pointSeries,...rankSeries];

  canvas.width=Math.floor(rect.width*dpr);
  canvas.height=Math.floor(rect.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,rect.width,rect.height);

  if(visible.length<2){
    ctx.fillStyle="#8b949e";
    ctx.font="13px Arial";
    ctx.fillText("Not enough points to chart.",16,28);
    return;
  }

  const padLeft=58;
  const padRight=18;
  const padTop=18;
  const padBottom=46;
  const width=rect.width-padLeft-padRight;
  const height=rect.height-padTop-padBottom;
  const stripY=rect.height-30;

  const minT=Math.min(...visible.map(point=>point.t));
  const maxT=Math.max(...visible.map(point=>point.t));

  const pointValues=pointSeries.map(point=>point.points).filter(Number.isFinite);
  const rankValues=rankSeries.map(point=>point.rank).filter(Number.isFinite);

  const minPoints=pointValues.length?Math.min(...pointValues):0;
  const maxPoints=pointValues.length?Math.max(...pointValues):0;
  const minRank=rankValues.length?Math.min(...rankValues):0;
  const maxRank=rankValues.length?Math.max(...rankValues):0;

  const x=point=>maxT===minT?padLeft:padLeft+((point.t-minT)/(maxT-minT))*width;
  const yp=point=>yScale(point.points,minPoints,maxPoints,padTop,height,"points");
  const yr=point=>yScale(point.rank,minRank,maxRank,padTop,height,"rank");

  ctx.strokeStyle="#30363d";
  ctx.font="12px Arial";
  ctx.fillStyle="#8b949e";

  const grid=pointValues.length
    ?{min:minPoints,max:maxPoints,type:"points"}
    :{min:minRank,max:maxRank,type:"rank"};

  for(let i=0;i<=4;i++){
    const pct=i/4;
    const yy=padTop+pct*height;
    const value=grid.type==="rank"
      ?grid.min+pct*(grid.max-grid.min)
      :grid.max-pct*(grid.max-grid.min);

    ctx.beginPath();
    ctx.moveTo(padLeft,yy);
    ctx.lineTo(rect.width-padRight,yy);
    ctx.stroke();

    ctx.fillText(grid.type==="rank"?`#${Math.round(value)}`:fmtShort(value),8,yy+4);
  }

  const updateMarkers=window.Ps99VersionMarkers?.draw(ctx,{
    minT,
    maxT,
    top:padTop,
    bottom:padTop+height,
    x
  })||[];

  drawLine(ctx,pointSeries,x,yp,clan().color);
  drawLine(ctx,rankSeries,x,yr,"#f2cc60");
  drawActivityStrip(ctx,strip,x,stripY);

  ctx.fillStyle="#8b949e";
  ctx.fillText(
    new Date(minT).toLocaleDateString(undefined,{month:"short",day:"numeric"}),
    padLeft,
    rect.height-12
  );

  const endLabel=new Date(maxT).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  ctx.fillText(endLabel,rect.width-padRight-ctx.measureText(endLabel).width,rect.height-12);

  chartCache={all,strip,x,yp,yr,stripY,rect,padTop,padBottom,updateMarkers};

  bindTooltip(canvas,tooltip);
}

function tooltipStatusForPoint(point){
  const strip=chartCache?.strip||[];
  if(!strip.length)return point.points===0?"0 points":"Scoring";

  let index=strip.findIndex(p=>p.t===point.t);

  if(index<0){
    let best=0;
    let bestDistance=Math.abs(strip[0].t-point.t);

    for(let i=1;i<strip.length;i++){
      const distance=Math.abs(strip[i].t-point.t);
      if(distance<bestDistance){
        best=i;
        bestDistance=distance;
      }
    }

    index=best;
  }

  const current=strip[index];
  const next=strip[index+1];
  const previous=strip[index-1];

  if(next)return segmentStatus(current,next);
  if(previous&&isDowntimeSegment(previous,current))return current.points===0?"0 points":"No point gain";

  return current.points===0?"0 points":"Scoring";
}

function bindTooltip(canvas,tooltip){
  if(canvas.dataset.bound)return;
  canvas.dataset.bound="1";

  canvas.onmouseleave=()=>{tooltip.style.display="none"};

  canvas.onmousemove=event=>{
    if(!chartCache)return;

    const rect=canvas.getBoundingClientRect();
    const mx=event.clientX-rect.left;
    const update=window.Ps99VersionMarkers?.nearest(chartCache.updateMarkers,mx);

    if(update){
      drawChart();
      const fresh=chartCache;
      const marker=window.Ps99VersionMarkers.nearest(fresh.updateMarkers,mx);
      window.Ps99VersionMarkers.highlight(
        canvas.getContext("2d"),
        marker,
        fresh.padTop,
        fresh.rect.height-fresh.padBottom
      );
      tooltip.innerHTML=window.Ps99VersionMarkers.tooltipHtml(marker,fmtDateTime);
      tooltip.style.display="block";
      tooltip.style.left=Math.max(8,event.clientX-rect.left+14)+"px";
      tooltip.style.top=Math.max(8,event.clientY-rect.top+14)+"px";
      return;
    }

    let nearest=chartCache.all[0];
    let distance=Math.abs(chartCache.x(nearest)-mx);

    for(const point of chartCache.all){
      const d=Math.abs(chartCache.x(point)-mx);
      if(d<distance){
        nearest=point;
        distance=d;
      }
    }

    drawChart();

    const fresh=chartCache;
    const ctx=canvas.getContext("2d");
    const px=fresh.x(nearest);
    const py=Math.abs(event.clientY-rect.top-fresh.stripY)<18
      ?fresh.stripY
      :showPoints&&nearest.points!==null
        ?fresh.yp(nearest)
        :fresh.yr(nearest);

    ctx.fillStyle="#e6edf3";
    ctx.beginPath();
    ctx.arc(px,py,4,0,Math.PI*2);
    ctx.fill();

    tooltip.innerHTML=`
      <strong>${fmtDateTime(nearest.rawT)}</strong>
      <div>Points: ${fmt(nearest.points)}</div>
      <div>Rank: ${fmt(nearest.rank)}</div>
      <div class="muted">${tooltipStatusForPoint(nearest)}</div>
    `;

    tooltip.style.display="block";
    tooltip.style.left=Math.max(8,event.clientX-rect.left+14)+"px";
    tooltip.style.top=Math.max(8,event.clientY-rect.top+14)+"px";
  };
}

async function main(){
  setupChrome();
  window.Ps99VersionMarkers?.load().then(()=>{
    if(document.getElementById("chart"))drawChart();
  });

  const id=profileId();
  const app=document.getElementById("app");

  if(!id){
    app.innerHTML=`<div class="error">Missing profile ID.</div>`;
    return;
  }

  try{
    optionalJson(ACTIVE_BATTLE).then(info=>{
      activeInfo=info;
      activeInfoLoaded=true;
      if(profile&&document.getElementById("battle-chart-detail")){
        renderBattle();
        notifyEmbedHeight();
      }
    });

    const[live,staticProfile,globalProfile,clansCurrent]=await Promise.all([
      loadLiveProfile(id).catch(()=>null),
      clan().key==="c0ld"?loadStaticProfile(id).catch(()=>null):Promise.resolve(null),
      loadGlobalProfile(id).catch(()=>null),
      loadCurrentClanLeaderboard().catch(()=>null)
    ]);

    profile=mergeProfiles(staticProfile,live);

    if(!profile){
      profile=globalProfile;
    }else if(globalProfile){
      const existingBattles=profile.battles||[];
      const globalBattles=globalProfile.battles||[];

      profile={
        ...profile,
        source_clan:globalProfile.source_clan??profile.source_clan??null,
        clan_name:globalProfile.clan_name??profile.clan_name??null,
        clan_rank:globalProfile.clan_rank??profile.clan_rank??null,
        clan_points:globalProfile.clan_points??profile.clan_points??null,
        member_rank:globalProfile.member_rank??profile.member_rank??null,
        member_points:globalProfile.member_points??profile.member_points??null,
        source_clan_rank:globalProfile.source_clan_rank??profile.source_clan_rank??null,
        source_clan_points:globalProfile.source_clan_points??profile.source_clan_points??null,
        source_clan_leaderboard_rank:globalProfile.source_clan_leaderboard_rank??profile.source_clan_leaderboard_rank??null,
        source_clan_leaderboard_points:globalProfile.source_clan_leaderboard_points??profile.source_clan_leaderboard_points??null,
        global_rank:globalProfile.global_rank??profile.global_rank??null,
        global_points:globalProfile.global_points??profile.global_points??null,
        total_global_players:globalProfile.total_global_players??profile.total_global_players??null,
        latest_seen:globalProfile.latest_seen??profile.latest_seen??null,
        latest_points:globalProfile.latest_points??profile.latest_points??null,
        joined_at:profile.joined_at??globalProfile.joined_at??null,
        leaderboard_summaries:mergeSummaries("leaderboard",profile.leaderboard_summaries,globalProfile.leaderboard_summaries),
        league_summaries:mergeSummaries("league",profile.league_summaries,globalProfile.league_summaries),
        battles:[...existingBattles,...globalBattles],
        total_battles:existingBattles.length+globalBattles.length,
        is_global_profile:Boolean(profile.is_global_profile||globalProfile.is_global_profile)
      };
    }

    const lookupUserId=
      profile?.user_id||
      globalProfile?.user_id||
      live?.user_id||
      staticProfile?.user_id||
      (/^\d+$/.test(String(id))?String(id):null);
    const leagueProfile=lookupUserId?await loadLeagueProfile(lookupUserId).catch(()=>null):null;

    if(!profile){
      profile=leagueProfile;
    }else if(leagueProfile){
      profile={
        ...profile,
        username:profile.username||leagueProfile.username,
        user_id:profile.user_id||leagueProfile.user_id,
        profile_url:profile.profile_url||leagueProfile.profile_url,
        latest_seen:profile.latest_seen??leagueProfile.latest_seen??null,
        league_summaries:mergeSummaries("league",profile.league_summaries,leagueProfile.league_summaries),
        leaderboard_summaries:mergeSummaries(
          "leaderboard",
          profile.leaderboard_summaries,
          leagueProfile.leaderboard_summaries
        )
      };
    }

    profile=applyCurrentClanLeaderboardRank(profile,clansCurrent);

    if(!profile)throw new Error(`Could not load profile ${id}.`);

    profile.profile_url=profile.user_id
      ?`https://www.roblox.com/users/${profile.user_id}/profile`
      :profile.profile_url;

    const externalProfile=profile.user_id?await loadExternalHistory(profile.user_id).catch(()=>null):null;
    if(externalProfile){
      profile={
        ...profile,
        external_clan_summaries:mergeClanPlacementRows(
          profile.external_clan_summaries||[],
          externalProfile.external_clan_summaries||[]
        )
      };
    }

    document.title=`${profile.username||"Player"} - ${clan().label} Profile`;
    render();
    notifyEmbedHeight();

    if(!profile.avatar_url&&profile.user_id){
      optionalJson(
        `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${profile.user_id}&size=150x150&format=Png&isCircular=false`
      ).then(thumbs=>{
        const imageUrl=thumbs?.data?.[0]?.imageUrl||null;
        if(!imageUrl)return;

        profile.avatar_url=imageUrl;
        const avatar=document.querySelector(".avatar");
        if(avatar)avatar.src=imageUrl;
        notifyEmbedHeight();
      });
    }
  }catch(error){
    console.error(error);
    app.innerHTML=`<div class="error">${escapeHtml(error.message)}</div>`;
    notifyEmbedHeight();
  }
}

window.addEventListener("resize",()=>{
  clearTimeout(window.__profileResize);
  window.__profileResize=setTimeout(()=>{
    drawChart();
    notifyEmbedHeight();
  },100);
});

main();
</script>
