name: Apply private server monitor worker update

on:
  push:
    branches:
      - fix-private-server-monitor-worker

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-private-server-monitor-worker

      - name: Update worker file
        shell: pwsh
        run: .\scripts\update-private-server-tracker-monitor-style.ps1

      - name: Remove temporary workflow
        shell: pwsh
        run: Remove-Item .github/workflows/apply-private-server-monitor.yml

      - name: Commit complete worker update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/c0ld-servers-worker.js .github/workflows/apply-private-server-monitor.yml
          git commit -m "Update private server monitor worker payload"
          git push origin HEAD:fix-private-server-monitor-worker
