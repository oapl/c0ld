name: Apply private server tracker monitor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-private-server-tracker-monitor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply tracker monitor update
        shell: pwsh
        run: ./scripts/update-private-server-tracker-monitor-style.ps1

      - name: Commit updated Worker
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/c0ld-servers-worker.js
          if (git diff --cached --quiet) {
            Write-Host "Worker already contains the tracker monitor update."
            exit 0
          }
          git commit -m "Update private server tracker monitor Worker"
          git push origin HEAD:main

# Triggered through a normal merge so GitHub Actions receives a push event.
