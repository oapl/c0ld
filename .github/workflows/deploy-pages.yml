name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir _site
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import sys

          source_root = Path("pages")
          site_root = Path("_site")
          seen = {}

          if not source_root.exists():
              raise SystemExit("Missing pages/ directory")

          for path in sorted(source_root.rglob("*.html")):
              target = site_root / path.name
              if path.name in seen:
                  print(f"Duplicate HTML route filename: {path.name}", file=sys.stderr)
                  print(f"  {seen[path.name]}", file=sys.stderr)
                  print(f"  {path}", file=sys.stderr)
                  raise SystemExit(1)
              seen[path.name] = path
              shutil.copy2(path, target)
              print(f"{path} -> {target}")

          if not seen:
              raise SystemExit("No HTML files found in pages/")
          PY
          cp -R Data assets _site/
          touch _site/.nojekyll
          printf '%s\n' 'c0ld-clan.com' > _site/CNAME

      - name: Generate individual clan pages
        run: node scripts/generate-clan-pages.js _site

      - name: Add shared site scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          head_tags = [
              '  <script src="assets/clan-theme-bootstrap.js"></script>\n',
          ]

          script_tags = [
              '  <script src="assets/site-navigation.js"></script>\n',
              '  <script src="assets/ps99-version-chart-markers.js"></script>\n',
              '  <script src="assets/clan-switcher.js"></script>\n',
              '  <script src="assets/header-logo-lock.js"></script>\n',
              '  <script src="assets/site-announcement.js"></script>\n',
              '  <script src="assets/protected-menus.js"></script>\n',
              '  <script src="assets/site-enhancements.js"></script>\n',
              '  <script src="assets/site-enhancements-compat.js"></script>\n',
              '  <script src="assets/clan-page-links.js"></script>\n',
              '  <script src="assets/clan-row-final-links.js"></script>\n',
              '  <script src="assets/profile-stat-cleanup.js"></script>\n',
              '  <script src="assets/reward-threshold-chart.js"></script>\n',
          ]

          for path in Path('_site').glob('*.html'):
              text = path.read_text(encoding='utf-8')

              head_inject = ''
              for tag in head_tags:
                  marker = tag.split('src="', 1)[1].split('"', 1)[0]
                  if marker not in text:
                      head_inject += tag

              if head_inject and '</head>' in text:
                  text = text.replace('</head>', head_inject + '</head>', 1)

              if '</body>' not in text:
                  continue

              inject = ''
              for tag in script_tags:
                  marker = tag.split('src="', 1)[1].split('"', 1)[0]
                  if marker not in text:
                      inject += tag

              if inject:
                  text = text.replace('</body>', inject + '</body>', 1)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
