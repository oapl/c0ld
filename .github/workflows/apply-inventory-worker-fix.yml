name: Apply inventory worker fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-inventory-worker-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct full-worker patch
        shell: bash
        run: |
          set -euo pipefail

          git apply --check cloudflare/inventory-worker-direct.patch
          git apply cloudflare/inventory-worker-direct.patch

          sed -i 's/main = "inventory-detector-worker-entry.js"/main = "inventory-detector-worker.js"/' cloudflare/wrangler-inventory-detector.toml.example

          rm -f cloudflare/inventory-detector-worker-entry.js
          rm -f cloudflare/inventory-worker-direct.patch
          rm -f .github/workflows/apply-inventory-worker-fix.yml

          node --check cloudflare/inventory-detector-worker.js
          node --check assets/league-hourly-pet-gains.js

          grep -q 'main = "inventory-detector-worker.js"' cloudflare/wrangler-inventory-detector.toml.example
          test ! -e cloudflare/inventory-detector-worker-entry.js

      - name: Commit corrected implementation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Integrate inventory readiness into full worker"
          git push origin HEAD:main
